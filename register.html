<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Road2Billionaire</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #1a1a1a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #111;
      padding: 30px;
      border-radius: 18px;
      box-sizing: border-box;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 10px;
      background: #222;
      color: white;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #ffd700;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #ffd700;
      text-decoration: none;
    }

    .message {
      display: none;
    }

    /* SUCCESS POPUP */
    .success-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .success-box {
      width: 100%;
      max-width: 430px;
      background: white;
      color: #111;
      border-radius: 22px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 45px rgba(255,255,255,0.25);
      animation: popup 0.4s ease;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #16a34a;
      color: white;
      font-size: 52px;
      line-height: 80px;
      font-weight: bold;
    }

    .success-box h2 {
      font-size: 25px;
      margin: 10px 0;
    }

    .success-box p {
      color: #555;
      font-size: 16px;
      margin: 8px 0;
    }

    @keyframes popup {
      from {
        transform: scale(0.7);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Create Account</h1>

    <form onsubmit="registerUser(event)">

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <div class="links">
      <a href="index.html">← Back to Home</a>
    </div>

  </div>


  <!-- SUCCESS POPUP -->

  <div id="successPopup" class="success-popup">

    <div class="success-box">

      <div class="success-icon">✓</div>

      <h2>Account Created Successfully!</h2>

      <p>Your account has been created successfully.</p>

      <p>Redirecting to Login...</p>

    </div>

  </div>


  <script>

    function registerUser(event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (password !== confirmPassword) {

        alert("❌ Passwords do not match.");

        return;

      }


      const user = {

        name: name,
        email: email,
        password: password

      };


      localStorage.setItem(
        "roadUser",
        JSON.stringify(user)
      );


      /* SHOW BIG SUCCESS POPUP */

      document.getElementById(
        "successPopup"
      ).style.display = "flex";


      /* REDIRECT AFTER 5 SECONDS */

      setTimeout(function() {

        window.location.replace("./login.html");

      }, 5000);

    }

  </script>

</body>
</html>
