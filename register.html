<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | Road2Billionaire</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h2>ROAD2BILLIONAIRE</h2>
  </header>

  <main style="max-width:500px;margin:50px auto;padding:20px;">

    <h1>Create Account</h1>

    <p>Create your Road2Billionaire account</p>

    <form onsubmit="registerUser(event)">

      <label>Full Name</label>
      <br>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
        style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box;"
      >

      <label>Email Address</label>
      <br>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
        style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box;"
      >

      <label>Password</label>
      <br>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
        style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box;"
      >

      <label>Confirm Password</label>
      <br>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
        style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box;"
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <p>
      <a href="index.html">← Back to Home</a>
    </p>

  </main>

  <script>
    function registerUser(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Password और Confirm Password समान नहीं हैं।");
        return;
      }

      alert("Registration system अभी backend से connected नहीं है।");
    }
  </script>

</body>
</html>
