<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Road2Billionaire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #292000 0%, #0b0b0b 45%, #000 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #111;
      padding: 35px 28px;
      border-radius: 22px;
      border: 1px solid rgba(255, 215, 0, 0.35);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.12);
    }

    .brand {
      text-align: center;
      color: #ffd700;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .admin-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 28px;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      color: #ffd700;
      font-size: 25px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      background: #1d1d1d;
      border: 1px solid #444;
      border-radius: 11px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #ffd700;
    }

    input::placeholder {
      color: #888;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #ffd700, #ffb700);
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #ffd700;
      text-decoration: none;
      font-size: 14px;
    }

    .demo {
      margin-top: 22px;
      padding: 12px;
      border-radius: 10px;
      background: #191919;
      color: #888;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    .error {
      display: none;
      color: #ff6b6b;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      Road2Billionaire
    </div>

    <div class="admin-title">
      ADMIN PANEL
    </div>

    <h1>
      🔐 Admin Login
    </h1>

    <form onsubmit="adminLogin(event)">

      <input
        type="email"
        id="adminEmail"
        placeholder="Admin Email"
        required
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Admin Password"
        required
      >

      <button type="submit">
        Login to Admin Panel
      </button>

    </form>

    <div id="error" class="error">
      ❌ Invalid admin credentials.
    </div>

    <div class="demo">
      Demo Admin Login<br>
      Email: admin@road2billionaire.com<br>
      Password: admin123
    </div>

    <div class="back">
      <a href="index.html">
        ← Back to Website
      </a>
    </div>

  </div>


  <script>

    function adminLogin(event) {

      event.preventDefault();

      const email =
        document.getElementById("adminEmail").value.trim();

      const password =
        document.getElementById("adminPassword").value;

      const error =
        document.getElementById("error");


      /*
        DEMO LOGIN ONLY

        Real secure admin authentication
        will be connected with backend later.
      */

      if (
        email === "admin@road2billionaire.com" &&
        password === "admin123"
      ) {

        localStorage.setItem(
          "adminLoggedIn",
          "true"
        );

        window.location.href = "admin.html";

      } else {

        error.style.display = "block";

      }

    }

  </script>

</body>
</html>
