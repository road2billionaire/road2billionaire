<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Dashboard | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.topbar{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #ffd700;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.logout{
  background:#dc2626;
  color:#fff;
  padding:9px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px 18px 60px;
}

.welcome{
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  margin-bottom:25px;
}

.welcome h1{
  color:#ffd700;
  margin-top:0;
}

.welcome p{
  color:#aaa;
}

.section-title{
  color:#ffd700;
  margin-top:30px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

.card h2{
  color:#ffd700;
  margin-top:0;
}

.card p{
  color:#bbb;
  line-height:1.6;
}

.price{
  color:#ffd700;
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

.btn{
  display:inline-block;
  padding:11px 16px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  margin-top:8px;
  margin-right:8px;
}

.view{
  background:#16a34a;
  color:#fff;
}

.details{
  background:#2563eb;
  color:#fff;
}

.browse{
  background:#ffd700;
  color:#000;
}

.empty{
  text-align:center;
  padding:35px 20px;
  background:#111;
  border:1px solid #333;
  border-radius:18px;
}

.empty h2{
  color:#ffd700;
}

</style>

</head>

<body>

<div class="topbar">

  <div class="brand">
    Road2Billionaire
  </div>

  <a
    href="#"
    class="logout"
    onclick="logoutUser(); return false;"
  >
    Logout
  </a>

</div>


<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h1>
      👋 Welcome, <span id="userName">User</span>
    </h1>

    <p>
      Email:
      <strong id="userEmail"></strong>
    </p>

    <p>
      Welcome to your Road2Billionaire User Dashboard.
    </p>

  </div>


  <!-- MY EBOOKS -->

  <h2 class="section-title">
    📚 My eBooks
  </h2>

  <div id="myBooks"></div>


  <!-- BROWSE -->

  <h2 class="section-title">
    🛍️ Browse eBooks
  </h2>

  <div class="card">

    <h2>
      Explore eBooks
    </h2>

    <p>
      Browse our available eBooks and choose the one you want to purchase.
    </p>

    <a
      href="ebook.html?from=dashboard&v=200001"
      class="btn browse"
    >
      📚 Browse All eBooks
    </a>

  </div>

</div>


<script>


/* =========================
   LOAD USER
========================= */

function loadUser(){

  const user =
    JSON.parse(
      localStorage.getItem("roadUser") || "null"
    );

  const email =
    localStorage.getItem("userEmail");


  if(user){

    document.getElementById(
      "userName"
    ).textContent =
      user.name || "User";


    document.getElementById(
      "userEmail"
    ).textContent =
      user.email || email || "";

  }

  else{

    document.getElementById(
      "userEmail"
    ).textContent =
      email || "";

  }

}



/* =========================
   LOAD PURCHASED BOOKS
========================= */

function loadMyBooks(){

  const container =
    document.getElementById("myBooks");

  let purchases = [];


  try{

    const saved =
      localStorage.getItem("purchasedBooks");


    if(saved){

      purchases =
        JSON.parse(saved);

    }


    if(!Array.isArray(purchases)){

      purchases = [];

    }

  }

  catch(error){

    console.log(
      "Purchased books error:",
      error
    );

    purchases = [];

  }



  /* NO PURCHASE */

  if(purchases.length === 0){

    container.innerHTML = `

      <div class="empty">

        <h2>
          📚 No Purchased eBooks
        </h2>

        <p>
          आपने अभी तक कोई eBook purchase नहीं की है।
        </p>

        <a
          href="ebook.html?from=dashboard&v=200001"
          class="btn browse"
        >
          🛒 Browse eBooks
        </a>

      </div>

    `;

    return;

  }



  container.innerHTML = "";



  /* LOAD CURRENT EBOOK DATA */

  let allBooks = [];

  try{

    const savedBooks =
      localStorage.getItem("ebooksData");

    if(savedBooks){

      allBooks =
        JSON.parse(savedBooks);

    }

    if(!Array.isArray(allBooks)){

      allBooks = [];

    }

  }

  catch(error){

    allBooks = [];

  }



  /* DISPLAY PURCHASES */

  purchases.forEach(function(purchase){

    const card =
      document.createElement("div");

    card.className =
      "card";


    /* Find original book */

    const originalBook =
      allBooks.find(function(book){

        return String(book.id) ===
               String(purchase.bookId);

      });


    const title =
      originalBook?.title ||
      purchase.title ||
      "Purchased eBook";


    const price =
      originalBook?.price ||
      purchase.price ||
      "0";


    card.innerHTML = `

      <h2>
        📖 ${escapeHTML(title)}
      </h2>

      <p>
        Purchase Date:
        ${escapeHTML(
          purchase.purchaseDate || "N/A"
        )}
      </p>

      <div class="price">
        ₹${escapeHTML(String(price))}
      </div>

      <a
        href="read.html?id=${encodeURIComponent(purchase.bookId)}"
        class="btn view"
      >
        📖 Read eBook
      </a>

      <a
        href="ebook-details.html?id=${encodeURIComponent(purchase.bookId)}&from=dashboard"
        class="btn details"
      >
        ℹ️ View Details
      </a>

    `;


    container.appendChild(card);

  });

}



/* =========================
   BASIC HTML ESCAPE
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* =========================
   LOGOUT
========================= */

function logoutUser(){

  localStorage.removeItem("loggedIn");

  localStorage.removeItem("userEmail");

  window.location.href =
    "login.html";

}



/* =========================
   START
========================= */

loadUser();

loadMyBooks();


</script>

</body>

</html>
