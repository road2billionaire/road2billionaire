<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.topbar{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #ffd700;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
}

.container{
  max-width:600px;
  margin:auto;
  padding:35px 18px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:20px;
  padding:25px;
}

h1{
  text-align:center;
  color:#ffd700;
}

.product{
  background:#191919;
  padding:18px;
  border-radius:12px;
  margin:20px 0;
}

.product h2{
  color:#ffd700;
  margin-top:0;
}

.price{
  color:#ffd700;
  font-size:28px;
  font-weight:bold;
  margin-top:15px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  color:#ddd;
}

input{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #444;
  background:#0b0b0b;
  color:white;
  font-size:15px;
}

.pay-btn{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:10px;
  background:#ffd700;
  color:#000;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.success{
  display:none;
  text-align:center;
  color:#7CFC00;
  margin-top:20px;
  line-height:1.7;
}

.note{
  margin-top:20px;
  padding:14px;
  background:#191919;
  border-radius:10px;
  color:#aaa;
  font-size:13px;
  line-height:1.6;
  text-align:center;
}

</style>

</head>

<body>

<div class="topbar">

  <div class="brand">
    Road2Billionaire
  </div>

  <a href="ebook.html" class="back">
    ← Back
  </a>

</div>


<div class="container">

  <div class="card">

    <h1>💳 Payment</h1>

    <div id="productBox" class="product">
      Loading eBook...
    </div>


    <label>Name</label>

    <input
      type="text"
      id="name"
      placeholder="Enter your name"
    >


    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >


    <button
      class="pay-btn"
      onclick="processPayment()"
    >
      💳 Complete Demo Payment
    </button>


    <div
      id="success"
      class="success"
    >
      ✅ Payment Successful!<br><br>

      Your eBook has been added to your account.
      <br><br>

      <a
        href="Dashboard.html"
        style="color:#ffd700;"
      >
        📚 Go to My Dashboard
      </a>
    </div>


    <div class="note">

      🔒 Demo payment only.<br>
      No real money is being charged.

    </div>

  </div>

</div>


<script>

let selectedBook = null;


function loadProduct(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  let books = JSON.parse(
    localStorage.getItem("ebooksData") || "[]"
  );


  selectedBook = books.find(function(item){

    return String(item.id) === String(id);

  });


  if(!selectedBook && books.length > 0){

    selectedBook = books[0];

  }


  if(!selectedBook){

    document.getElementById(
      "productBox"
    ).innerHTML = `
      <h2>eBook Not Found</h2>
      <p>Please go back and select an eBook.</p>
    `;

    return;

  }


  document.getElementById(
    "productBox"
  ).innerHTML = `

    <h2>
      ${selectedBook.title}
    </h2>

    <p>
      ${selectedBook.description}
    </p>

    <div class="price">
      ₹${selectedBook.price}
    </div>

  `;

}


function processPayment(){

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();


  if(!name || !email){

    alert(
      "Please enter your name and email."
    );

    return;

  }


  if(!selectedBook){

    alert(
      "eBook information not found."
    );

    return;

  }


  let purchases = JSON.parse(
    localStorage.getItem("purchasedBooks") || "[]"
  );


  const alreadyPurchased =
    purchases.some(function(item){

      return String(item.bookId) ===
        String(selectedBook.id);

    });


  if(!alreadyPurchased){

    purchases.push({

      bookId: selectedBook.id,

      title: selectedBook.title,

      price: selectedBook.price,

      email: email,

      name: name,

      purchaseDate:
        new Date().toLocaleString()

    });


    localStorage.setItem(
      "purchasedBooks",
      JSON.stringify(purchases)
    );

  }


  document.getElementById(
    "success"
  ).style.display = "block";


  document.querySelector(
    ".pay-btn"
  ).style.display = "none";

}


loadProduct();

</script>

</body>

</html>
