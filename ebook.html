<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eBook Management | Road2Billionaire</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:white;
}

.topbar{
  background:#111;
  padding:18px;
  border-bottom:1px solid #ffd700;
  display:flex;
  justify-content:space-between;
}

.brand{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
}

.container{
  max-width:800px;
  margin:auto;
  padding:30px 18px;
}

h1{
  text-align:center;
  color:#ffd700;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
  margin-top:25px;
}

h2{
  color:#ffd700;
}

p{
  color:#bbb;
  line-height:1.6;
}

.price{
  color:#ffd700;
  font-size:28px;
  font-weight:bold;
  margin:20px 0;
}

button,a{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  margin:5px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.add{
  background:#ffd700;
  color:#000;
}

.edit{
  background:#2563eb;
  color:#fff;
}

.delete{
  background:#dc2626;
  color:#fff;
}

.view{
  background:#16a34a;
  color:#fff;
}

.empty{
  text-align:center;
  padding:40px;
  background:#111;
  border-radius:18px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">Road2Billionaire</div>
  <a href="admin.html" class="back">← Admin Panel</a>
</div>

<div class="container">

<h1>📚 eBook Management</h1>

<div id="ebookBox"></div>

</div>

<script>

function showEbook(){

  let data = localStorage.getItem("ebookData");

  let box = document.getElementById("ebookBox");

  if(!data){

    box.innerHTML = `
      <div class="empty">
        <h2>No eBook Added</h2>
        <p>Please add an eBook first.</p>

        <a href="add-ebook.html" class="add">
          ➕ Add New eBook
        </a>
      </div>
    `;

    return;
  }

  let ebook = JSON.parse(data);

  box.innerHTML = `
    <div class="card">

      <h2>${ebook.title}</h2>

      <p>${ebook.description}</p>

      <p>
        <b>Topics:</b><br>
        ${ebook.topics}
      </p>

      <div class="price">
        ₹${ebook.price}
      </div>

      <button class="edit" onclick="editBook()">
        ✏️ Edit
      </button>

      <button class="delete" onclick="deleteBook()">
        🗑️ Delete
      </button>

      <a href="Product.html" class="view">
        👁️ View Product
      </a>

      <a href="add-ebook.html" class="add">
        ➕ Add New
      </a>

    </div>
  `;
}


function editBook(){

  let data = localStorage.getItem("ebookData");

  if(!data){
    alert("No eBook found!");
    return;
  }

  let ebook = JSON.parse(data);

  let title = prompt("eBook Title:", ebook.title);

  if(title === null) return;

  let description = prompt(
    "Description:",
    ebook.description
  );

  if(description === null) return;

  let topics = prompt(
    "Topics:",
    ebook.topics
  );

  if(topics === null) return;

  let price = prompt(
    "Price:",
    ebook.price
  );

  if(price === null) return;

  let oldPrice = prompt(
    "Old Price:",
    ebook.oldPrice || ""
  );

  if(oldPrice === null) return;

  ebook.title = title;
  ebook.description = description;
  ebook.topics = topics;
  ebook.price = price;
  ebook.oldPrice = oldPrice;

  localStorage.setItem(
    "ebookData",
    JSON.stringify(ebook)
  );

  alert("✅ eBook Updated Successfully!");

  showEbook();
}


function deleteBook(){

  let confirmDelete = confirm(
    "Are you sure you want to delete this eBook?"
  );

  if(!confirmDelete) return;

  localStorage.removeItem("ebookData");

  alert("🗑️ eBook Deleted Successfully!");

  showEbook();
}


showEbook();

</script>

</body>
</html>
