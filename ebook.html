<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All eBooks | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.topbar{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #ffd700;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px 18px 60px;
}

h1{
  color:#ffd700;
  text-align:center;
  margin-bottom:30px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
}

.card h2{
  color:#ffd700;
  margin-top:0;
}

.card p{
  color:#bbb;
  line-height:1.6;
}

.price{
  color:#ffd700;
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

.old-price{
  color:#777;
  text-decoration:line-through;
  margin-left:8px;
  font-size:16px;
}

.btn{
  display:inline-block;
  padding:10px 15px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  margin:5px 5px 5px 0;
  border:none;
  cursor:pointer;
}

.view{
  background:#16a34a;
  color:#fff;
}

.edit{
  background:#2563eb;
  color:#fff;
}

.delete{
  background:#dc2626;
  color:#fff;
}

.empty{
  text-align:center;
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:35px 20px;
}

.empty h2{
  color:#ffd700;
}

</style>

</head>

<body>


<div class="topbar">

  <div class="brand">
    Road2Billionaire
  </div>

  <a
    href="#"
    class="back"
    id="backButton"
  >
    ← Back
  </a>

</div>


<div class="container">

  <h1>
    📚 All eBooks
  </h1>

  <div id="booksList"></div>

</div>


<script>


/* BACK BUTTON */

const params =
  new URLSearchParams(
    window.location.search
  );

const from =
  params.get("from");


const backButton =
  document.getElementById(
    "backButton"
  );


if(from === "dashboard"){

  backButton.href =
    "Dashboard.html";

  backButton.textContent =
    "← Dashboard";

}
else{

  backButton.href =
    "admin.html";

  backButton.textContent =
    "← Admin Panel";

}


/* LOAD BOOKS */

function loadBooks(){

  const box =
    document.getElementById(
      "booksList"
    );


  let books =
    JSON.parse(
      localStorage.getItem(
        "ebooksData"
      ) || "[]"
    );


  if(books.length === 0){

    box.innerHTML = `

      <div class="empty">

        <h2>
          No eBooks Available
        </h2>

        <p>
          अभी कोई eBook उपलब्ध नहीं है।
        </p>

      </div>

    `;

    return;

  }


  box.innerHTML = "";


  books.forEach(function(book){

    box.innerHTML += `

      <div class="card">

        <h2>
          📖 ${book.title}
        </h2>

        <p>
          ${book.description || ""}
        </p>

        <div class="price">

          ₹${book.price}

          ${
            book.oldPrice
            ?
            `<span class="old-price">
              ₹${book.oldPrice}
            </span>`
            :
            ""
          }

        </div>


        <a
          href="ebook-details.html?id=${book.id}&from=${from || "admin
