<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add eBook | Road2Billionaire</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
  padding:30px 18px;
}

h1{
  text-align:center;
  color:#ffd700;
}

.box{
  background:#111;
  padding:25px;
  border-radius:15px;
  border:1px solid #333;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
}

input,textarea{
  width:100%;
  padding:13px;
  background:#000;
  color:white;
  border:1px solid #444;
  border-radius:8px;
  box-sizing:border-box;
}

textarea{
  min-height:100px;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  background:#ffd700;
  color:#000;
  border:0;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>

<body>

<div class="container">

<h1>➕ Add New eBook</h1>

<div class="box">

<form id="ebookForm">

<label>eBook Title</label>
<input type="text" id="title" required>

<label>Description</label>
<textarea id="description" required></textarea>

<label>Topics</label>
<textarea id="topics" required></textarea>

<label>Price (₹)</label>
<input type="number" id="price" required>

<label>Old Price (₹)</label>
<input type="number" id="oldPrice">

<label>PDF / File Link</label>
<input type="text" id="fileLink">

<button type="submit">
💾 Add eBook
</button>

</form>

</div>
</div>

<script>

document.getElementById("ebookForm").addEventListener("submit", function(event){

  event.preventDefault();

  let newBook = {
    id: Date.now(),
    title: document.getElementById("title").value,
    description: document.getElementById("description").value,
    topics: document.getElementById("topics").value,
    price: document.getElementById("price").value,
    oldPrice: document.getElementById("oldPrice").value,
    fileLink: document.getElementById("fileLink").value
  };

  let books = JSON.parse(
    localStorage.getItem("ebooksData") || "[]"
  );

  books.push(newBook);

  localStorage.setItem(
    "ebooksData",
    JSON.stringify(books)
  );

  alert("✅ eBook Added Successfully!");

  window.location.href = "ebook.html";

});

</script>

</body>
</html>
