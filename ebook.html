<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>eBooks | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:white;
}

.topbar{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #ffd700;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
  background:#222;
  padding:10px 15px;
  border-radius:8px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:30px 18px;
}

h1{
  text-align:center;
  color:#ffd700;
  margin-bottom:30px;
}

.book-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:20px;
}

.book-card{
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  padding:22px;
}

.book-image{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:15px;
  background:#222;
}

.book-card h2{
  color:#ffd700;
  margin-top:0;
}

.book-card p{
  color:#ccc;
  line-height:1.6;
}

.price{
  font-size:23px;
  font-weight:bold;
  color:#00d084;
  margin:18px 0;
}

.old-price{
  color:#777;
  text-decoration:line-through;
  font-size:14px;
  margin-left:8px;
}

.view{
  display:inline-block;
  background:#ffd700;
  color:#000;
  text-decoration:none;
  padding:12px 18px;
  border-radius:8px;
  font-weight:bold;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  padding:35px 20px;
}

.empty h2{
  color:#ffd700;
}

.add{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#ffd700;
  text-decoration:none;
}

</style>

</head>

<body>

<div class="topbar">

  <div class="logo">
    Road2Billionaire
  </div>

  <a href="admin.html" class="back" id="backButton">
    ← Back
  </a>

</div>


<div class="container">

<h1>📚 eBooks</h1>

<div class="book-list" id="bookList">

<!-- BOOKS WILL LOAD HERE -->

</div>


<a
  href="add-ebook.html"
  class="add"
>
  ➕ Add New eBook
</a>


</div>


<script>

(function(){

  /* =========================
     BACK BUTTON
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const from =
    params.get("from");

  const backButton =
    document.getElementById("backButton");


  if(from === "dashboard"){

    backButton.href =
      "Dashboard.html";

  }else{

    backButton.href =
      "admin.html";

  }


  /* =========================
     BOOK LIST
  ========================= */

  const list =
    document.getElementById("bookList");


  let ebooks = [];


  try{

    const saved =
      localStorage.getItem("ebooksData");


    if(saved){

      ebooks =
        JSON.parse(saved);

    }

  }catch(error){

    console.log(
      "Book loading error:",
      error
    );

    ebooks = [];

  }


  /* =========================
     NO BOOKS
  ========================= */

  if(
    !Array.isArray(ebooks) ||
    ebooks.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        <h2>
          📚 No eBooks Available
        </h2>

        <p>
          अभी कोई eBook add नहीं की गई है।
        </p>

      </div>

    `;

    return;

  }


  /* =========================
     DISPLAY BOOKS
  ========================= */

  ebooks.forEach(function(book){

    const card =
      document.createElement("div");

    card.className =
      "book-card";


    const image =
      book.image || "";


    card.innerHTML = `

      ${
        image
        ? `
          <img
            src="${image}"
            class="book-image"
            alt="${book.title || "eBook"}"
            onerror="this.style.display='none'"
          >
        `
        : ""
      }


      <h2>
        ${book.title || "eBook"}
      </h2>


      <p>
        ${book.description || ""}
      </p>


      <p>

        <strong>
          Topics:
        </strong>

        <br>

        ${book.topics || "Not specified"}

      </p>


      <div class="price">

        ₹${book.price || "0"}

        ${
          book.oldPrice
          ? `
            <span class="old-price">
              ₹${book.oldPrice}
            </span>
          `
          : ""
        }

      </div>


      <a
        href="ebook-details.html?id=${encodeURIComponent(book.id)}&from=${encodeURIComponent(from || "admin")}"
        class="view"
      >
        📖 View eBook
      </a>

    `;


    list.appendChild(card);

  });

})();

</script>

</body>
</html>
