<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage eBooks | Road2Billionaire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #292000 0%, #0b0b0b 45%, #000 100%);
      color: white;
      min-height: 100vh;
    }

    .topbar {
      background: #111;
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      color: #ffd700;
      font-size: 21px;
      font-weight: bold;
    }

    .back {
      color: #ffd700;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      color: #ffd700;
      text-align: center;
      margin-bottom: 25px;
    }

    .ebook-card {
      background: #111;
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .ebook-card h2 {
      color: #ffd700;
      margin-top: 0;
    }

    .ebook-card p {
      color: #aaa;
      line-height: 1.5;
    }

    .price {
      color: #ffd700;
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }

    .old-price {
      color: #777;
      text-decoration: line-through;
      font-size: 15px;
      margin-left: 8px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .add-btn {
      background: #ffd700;
      color: #000;
    }

    .edit-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .empty {
      text-align: center;
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 40px 20px;
      color: #888;
    }

    .empty strong {
      display: block;
      color: #ffd700;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .topics {
      color: #ccc !important;
      background: #191919;
      padding: 12px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="topbar">

    <div class="brand">
      Road2Billionaire
    </div>

    <a href="admin.html" class="back">
      ← Admin Panel
    </a>

  </div>


  <div class="container">

    <h1>📚 Manage eBooks</h1>

    <div id="ebookList"></div>

  </div>


  <script>

    function loadEbook() {

      const ebookData =
        localStorage.getItem("ebookData");

      const list =
        document.getElementById("ebookList");


      if (!ebookData) {

        list.innerHTML = `
          <div class="empty">
            <strong>No eBook Added Yet</strong>
            Please add an eBook from the Admin Panel.
            <br><br>
            <a href="add-ebook.html"
               class="btn add-btn">
              ➕ Add New eBook
            </a>
          </div>
        `;

        return;
      }


      const ebook =
        JSON.parse(ebookData);


      list.innerHTML = `

        <div class="ebook-card">

          <h2>
            ${ebook.title}
          </h2>

          <p>
            ${ebook.description}
          </p>

          <p class="topics">
            <strong>Topics:</strong><br>
            ${ebook.topics}
          </p>

          <div class="price">
            ₹${ebook.price}

            ${
              ebook.oldPrice
              ? `<span class="old-price">
                   ₹${ebook.oldPrice}
                 </span>`
              : ""
            }

          </div>

          <div class="buttons">

            <a
              href="add-ebook.html"
              class="btn add-btn">
              ➕ Add New
            </a>

            <button
              class="btn edit-btn"
              onclick="editEbook()">
              ✏️ Edit
            </button>

            <button
              class="btn delete-btn"
              onclick="deleteEbook()">
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    }


    function deleteEbook() {

      const confirmDelete =
        confirm(
          "Are you sure you want to delete this eBook?"
        );


      if (confirmDelete) {

        localStorage.removeItem("ebookData");

        loadEbook();

      }

    }


    function editEbook() {

      alert(
        "Edit option will be connected in the next step."
      );

    }


    loadEbook();

  </script>

</body>
</html>
