<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>eBook Details | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.topbar{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #ffd700;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:850px;
  margin:auto;
  padding:30px 18px 60px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 20px rgba(255,215,0,.08);
}

h1{
  color:#ffd700;
  margin-top:0;
  line-height:1.3;
}

.description{
  color:#ccc;
  line-height:1.7;
  font-size:16px;
}

.topics{
  background:#191919;
  border-radius:12px;
  padding:18px;
  margin-top:20px;
  color:#ddd;
  line-height:1.7;
}

.price{
  margin-top:25px;
  font-size:30px;
  font-weight:bold;
  color:#ffd700;
}

.old-price{
  color:#777;
  font-size:16px;
  text-decoration:line-through;
  margin-left:8px;
}

.buy{
  display:block;
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#ffd700;
  color:#000;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.buy:hover{
  background:#fff;
}

.message{
  display:none;
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:#162b16;
  border:1px solid #2e8b2e;
  color:#8cff8c;
  text-align:center;
}

.home{
  display:inline-block;
  margin-top:20px;
  color:#ffd700;
  text-decoration:none;
}

.error{
  text-align:center;
  padding:40px 20px;
}

.error h2{
  color:#ff4444;
}

</style>

</head>

<body>

<div class="topbar">

  <div class="brand">
    Road2Billionaire
  </div>

  <a href="ebook.html" class="back">
    ← Back
  </a>

</div>


<div class="container">

  <div id="ebookDetails"></div>

</div>


<script>

function loadBook(){

  const box =
    document.getElementById("ebookDetails");

  const params =
    new URLSearchParams(window.location.search);

  const id =
    params.get("id");

  let books = JSON.parse(
    localStorage.getItem("ebooksData") || "[]"
  );

  if(books.length === 0){

    box.innerHTML = `
      <div class="card error">
        <h2>eBook Not Found</h2>
        <p>No eBook is available.</p>
        <a href="ebook.html" class="home">
          ← Back to eBooks
        </a>
      </div>
    `;

    return;
  }


  let book;

  if(id){

    book = books.find(function(item){

      return String(item.id) === String(id);

    });

  }


  if(!book){

    book = books[0];

  }


  box.innerHTML = `

    <div class="card">

      <h1>
        ${book.title}
      </h1>

      <div class="description">

        ${book.description}

      </div>


      <div class="topics">

        <strong>📚 What You Will Learn</strong>

        <br><br>

        ${book.topics}

      </div>


      <div class="price">

        ₹${book.price}

        ${
          book.oldPrice
          ?
          `<span class="old-price">
            ₹${book.oldPrice}
          </span>`
          :
          ""
        }

      </div>


      <button
        class="buy"
        onclick="buyNow()"
      >
        🛒 Buy Now
      </button>


      <div
        id="message"
        class="message"
      >
        ✅ Buy Now selected.<br>
        Payment system will be connected next.
      </div>


      <a
        href="ebook.html"
        class="home"
      >
        ← Back to All eBooks
      </a>

    </div>

  `;

}


function buyNow(){

  const loggedIn =
    localStorage.getItem("loggedIn");


  if(loggedIn !== "true"){

    alert(
      "Please login first to continue."
    );

    window.location.href =
      "login.html";

    return;

  }


  document.getElementById(
    "message"
  ).style.display = "block";

}


loadBook();

</script>

</body>

</html>
