<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>eBook Details | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.topbar{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #ffd700;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
  background:#222;
  padding:10px 15px;
  border-radius:8px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:30px 18px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
}

.book-image{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:12px;
  margin-bottom:20px;
  background:#222;
}

h1{
  color:#ffd700;
}

p{
  color:#bbb;
  line-height:1.7;
}

.price{
  color:#00d084;
  font-size:26px;
  font-weight:bold;
  margin:20px 0;
}

.old-price{
  color:#777;
  text-decoration:line-through;
  font-size:15px;
  margin-left:8px;
}

.btn{
  display:inline-block;
  padding:13px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  border:0;
  cursor:pointer;
  font-size:16px;
  margin-right:8px;
  margin-top:8px;
}

.buy{
  background:#ffd700;
  color:#000;
}

.read{
  background:#16a34a;
  color:#fff;
}

.error{
  color:#ff5555;
  text-align:center;
}

</style>

</head>

<body>

<div class="topbar">

  <div class="logo">
    Road2Billionaire
  </div>

  <a
    href="Dashboard.html?v=200001"
    class="back"
  >
    ← Back
  </a>

</div>


<div class="container">

  <div
    class="card"
    id="bookDetails"
  >

    <h1>
      📖 Loading eBook...
    </h1>

  </div>

</div>


<script>

(function(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");

  const container =
    document.getElementById(
      "bookDetails"
    );


  if(!id){

    container.innerHTML = `

      <h1>❌ eBook Not Found</h1>

      <p class="error">
        eBook ID नहीं मिला।
      </p>

    `;

    return;
  }


  /* LOAD EBOOKS */

  let ebooks = [];

  try{

    const saved =
      localStorage.getItem(
        "ebooksData"
      );

    if(saved){

      ebooks =
        JSON.parse(saved);

    }

  }
  catch(error){

    ebooks = [];

  }


  if(!Array.isArray(ebooks)){

    ebooks = [];

  }


  /* FIND BOOK */

  const book =
    ebooks.find(function(item){

      return String(item.id) ===
             String(id);

    });


  if(!book){

    container.innerHTML = `

      <h1>❌ eBook Not Found</h1>

      <p class="error">
        यह eBook इस browser में उपलब्ध नहीं है।
      </p>

      <a
        href="ebook.html"
        class="btn buy"
      >
        📚 Back to eBooks
      </a>

    `;

    return;
  }


  /* CHECK PURCHASE */

  let purchasedBooks = [];

  try{

    const purchased =
      localStorage.getItem(
        "purchasedBooks"
      );

    if(purchased){

      purchasedBooks =
        JSON.parse(purchased);

    }

  }
  catch(error){

    purchasedBooks = [];

  }


  if(!Array.isArray(purchasedBooks)){

    purchasedBooks = [];

  }


  const purchased =
    purchasedBooks.some(function(item){

      return String(item.bookId) ===
             String(book.id);

    });


  /* IMAGE */

  let imageHTML = "";

  if(book.image){

    imageHTML = `

      <img
        src="${book.image}"
        class="book-image"
        alt="${book.title || "eBook"}"
        onerror="this.style.display='none'"
      >

    `;

  }


  /* ACTION BUTTON */

  let actionButton = "";


  if(purchased){

    if(book.pdfUrl){

      actionButton = `

        <a
          href="read.html?id=${encodeURIComponent(book.id)}"
          class="btn read"
        >
          📖 Read eBook
        </a>

      `;

    }
    else{

      actionButton = `

        <p class="error">
          ❌ PDF link उपलब्ध नहीं है।
        </p>

      `;

    }

  }
  else{

    actionButton = `

      <button
        class="btn buy"
        id="buyButton"
      >
        🛒 Buy Now
      </button>

    `;

  }


  /* DISPLAY BOOK */

  container.innerHTML = `

    ${imageHTML}

    <h1>
      ${book.title || "eBook"}
    </h1>

    <p>
      ${book.description || ""}
    </p>

    <p>

      <strong>
        Topics:
      </strong>

      <br>

      ${book.topics || "Not specified"}

    </p>

    <div class="price">

      ₹${book.price || "0"}

      ${
        book.oldPrice
        ? `
          <span class="old-price">
            ₹${book.oldPrice}
          </span>
        `
        : ""
      }

    </div>

    ${actionButton}

  `;


  /* BUY BUTTON */

  const buyButton =
    document.getElementById(
      "buyButton"
    );


  if(buyButton){

    buyButton.addEventListener(
      "click",
      function(){

        buyNow(book.id);

      }
    );

  }

})();


/* BUY NOW */

function buyNow(id){

  const loggedIn =
    localStorage.getItem(
      "loggedIn"
    );


  if(loggedIn !== "true"){

    alert(
      "Please login first to continue."
    );

    window.location.href =
      "login.html";

    return;
  }


  window.location.href =
    "payment.html?id=" +
    encodeURIComponent(id);

}

</script>

</body>

</html>
