<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>eBook Details | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.topbar{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #ffd700;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
  background:#222;
  padding:10px 15px;
  border-radius:8px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:30px 18px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
}

h1{
  color:#ffd700;
}

p{
  color:#bbb;
  line-height:1.7;
}

.price{
  color:#00d084;
  font-size:26px;
  font-weight:bold;
  margin:20px 0;
}

.old-price{
  color:#777;
  text-decoration:line-through;
  font-size:15px;
  margin-left:8px;
}

.btn{
  display:inline-block;
  padding:13px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  border:0;
  cursor:pointer;
  font-size:16px;
  margin-right:8px;
}

.buy{
  background:#ffd700;
  color:#000;
}

.read{
  background:#16a34a;
  color:#fff;
}

.error{
  color:#ff5555;
  text-align:center;
}

</style>

</head>

<body>

<div class="topbar">

  <div class="logo">
    Road2Billionaire
  </div>

  <a
    href="Dashboard.html?v=200001"
    class="back"
  >
    ← Back
  </a>

</div>


<div class="container">

  <div
    class="card"
    id="bookDetails"
  >

    <h1>
      📖 Loading eBook...
    </h1>

  </div>

</div>


<script>

(function(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  const container =
    document.getElementById(
      "bookDetails"
    );


  if(!id){

    container.innerHTML = `

      <h1>
        ❌ eBook Not Found
      </h1>

      <p class="error">
        eBook ID नहीं मिला।
      </p>

    `;

    return;

  }


  let ebooks = [];


  try{

    const saved =
      localStorage.getItem(
        "ebooksData"
      );


    if(saved){

      ebooks =
        JSON.parse(saved);

    }

  }
  catch(error){

    ebooks = [];

  }


  if(!Array.isArray(ebooks)){

    ebooks = [];

  }


  const book =
    ebooks.find(function(item){

      return String(item.id) === String(id);

    });


  if(!book){

    container.innerHTML = `

      <h1>
        ❌ eBook Not Found
      </h1>

      <p class="error">
        यह eBook इस browser में उपलब्ध नहीं है।
      </p>

      <a
        href="ebook.html?from=dashboard&v=200001"
        class="btn buy"
      >
        📚 Back to eBooks
      </a>

    `;

    return;

  }


  /* CHECK PURCHASE */

  let purchasedBooks = [];


  try{

    const purchased =
      localStorage.getItem(
        "purchasedBooks"
      );


    if(purchased){

      purchasedBooks =
        JSON.parse(purchased);

    }


    if(!Array.isArray(purchasedBooks)){

      purchasedBooks = [];

    }

  }
  catch(error){

    purchasedBooks = [];

  }


  const purchased =
    purchasedBooks.some(function(item){

      return String(item.bookId) === String(book.id);

    });


  let actionButton = "";


  if(purchased){

    actionButton = `

      <a
        href="${book.fileLink || "#"}"
        class="btn read"
        target="_blank"
        rel="noopener"
      >
        📖 Read eBook
      </a>

    `;

  }
  else{

    actionButton = `

      <button
        class="btn buy"
        onclick="buyNow('${String(book.id).replace(/'/g, "\\'")}')"
      >
        🛒 Buy Now
      </button>

    `;

  }


  container.innerHTML = `

    <h1>
      ${book.title || "eBook"}
    </h1>

    <p>
      ${book.description || ""}
    </p>

    <p>
      <strong>
        Topics:
      </strong>
      <br>
      ${book.topics || "Not specified"}
    </p>

    <div class="price">

      ₹${book.price || "0"}

      ${
        book.oldPrice
        ? `
          <span class="old-price">
            ${book.oldPrice}
          </span>
        `
        : ""
      }

    </div>

    ${actionButton}

  `;

})();



function buyNow(id){

  const loggedIn =
    localStorage.getItem(
      "loggedIn"
    );


  if(loggedIn !== "true"){

    alert(
      "Please login first to continue."
    );

    window.location.href =
      "login.html";

    return;

  }


  window.location.href =
    "payment.html?id=" +
    encodeURIComponent(id);

}

</script>

</body>

</html>
