<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Road2Billionaire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #292000 0%, #0b0b0b 45%, #000000 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 17, 17, 0.96);
      padding: 35px 28px;
      border-radius: 22px;
      border: 1px solid rgba(255, 215, 0, 0.35);
      box-shadow:
        0 0 35px rgba(255, 215, 0, 0.12),
        0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
      color: #ffd700;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 28px;
    }

    h1 {
      text-align: center;
      color: #ffd700;
      margin: 0 0 25px;
      font-size: 28px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 11px;
      background: #1c1c1c;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.18);
    }

    input::placeholder {
      color: #888;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #ffd700, #ffb700);
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 215, 0, 0.2);
    }

    button:active {
      transform: scale(0.98);
    }

    .links {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }

    .links a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .home-link {
      margin-top: 15px;
    }

    /* LOGIN SUCCESS POPUP */

    .success-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.80);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .success-box {
      width: 100%;
      max-width: 430px;
      background: white;
      color: #111;
      border-radius: 22px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 45px rgba(255, 215, 0, 0.25);
      animation: popup 0.4s ease;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #16a34a;
      color: white;
      font-size: 52px;
      line-height: 80px;
      font-weight: bold;
    }

    .success-box h2 {
      font-size: 25px;
      margin: 10px 0;
    }

    .success-box p {
      color: #555;
      font-size: 16px;
      margin: 8px 0;
    }

    @keyframes popup {
      from {
        transform: scale(0.7);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Road2Billionaire
    </div>

    <div class="subtitle">
      Learn. Manage. Grow.
    </div>

    <h1>Login</h1>

    <form onsubmit="loginUser(event)">

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div class="links">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <div class="links home-link">
      <a href="index.html">← Back to Home</a>
    </div>

  </div>


  <!-- SUCCESS POPUP -->

  <div id="successPopup" class="success-popup">

    <div class="success-box">

      <div class="success-icon">✓</div>

      <h2>Login Successful!</h2>

      <p>Welcome to Road2Billionaire.</p>

      <p>Opening your dashboard...</p>

    </div>

  </div>


  <script>

    function loginUser(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        alert("Please enter email and password.");

        return;

      }


      localStorage.setItem("loggedIn", "true");

      localStorage.setItem("userEmail", email);


      /* SHOW SUCCESS POPUP */

      document.getElementById(
        "successPopup"
      ).style.display = "flex";


      /* OPEN DASHBOARD AFTER 2 SECONDS */

      setTimeout(function() {

        window.location.href = "Dashboard.html";

      }, 2000);

    }

  </script>

</body>
</html>
