<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Add eBook | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  background:#111;

  border-bottom:1px solid #ffd700;

  padding:16px 18px;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{
  color:#ffd700;

  font-size:21px;

  font-weight:bold;
}

.back{
  color:#ffd700;

  background:#222;

  text-decoration:none;

  padding:9px 14px;

  border-radius:7px;

  font-size:14px;
}


/* =========================
   CONTAINER
========================= */

.container{
  max-width:700px;

  margin:auto;

  padding:25px 18px;
}


/* =========================
   CARD
========================= */

.card{
  background:#111;

  border:1px solid #333;

  border-radius:18px;

  padding:25px;
}

h1{
  color:#ffd700;

  margin-top:0;
}


/* =========================
   FORM
========================= */

label{
  display:block;

  margin-top:18px;

  margin-bottom:7px;

  color:#ddd;

  font-weight:bold;
}

input,
textarea{

  width:100%;

  padding:13px;

  border-radius:8px;

  border:1px solid #444;

  background:#222;

  color:#fff;

  font-size:15px;

}

input:focus,
textarea:focus{

  outline:none;

  border-color:#ffd700;

}

textarea{

  min-height:100px;

  resize:vertical;

}


/* =========================
   UPLOAD BUTTON
========================= */

.upload-btn{

  width:100%;

  padding:14px;

  border:0;

  border-radius:8px;

  background:#ffd700;

  color:#000;

  font-weight:bold;

  font-size:16px;

  cursor:pointer;

  margin-top:8px;
}

.upload-btn:disabled{

  opacity:.5;

  cursor:not-allowed;
}


/* =========================
   STATUS
========================= */

.status{

  margin-top:10px;

  padding:10px;

  border-radius:7px;

  background:#181818;

  color:#aaa;

  font-size:14px;

  word-break:break-word;
}

.success{
  color:#7dff91;
}

.error{
  color:#ff5555;
}


/* =========================
   IMAGE PREVIEW
========================= */

.preview{

  width:100%;

  max-height:220px;

  object-fit:contain;

  background:#222;

  border-radius:10px;

  margin-top:12px;

  display:none;
}


/* =========================
   SMALL TEXT
========================= */

.small{

  color:#777;

  font-size:12px;

  margin-top:6px;

  line-height:1.5;
}


/* =========================
   GOOGLE DRIVE BOX
========================= */

.drive-box{

  background:#181818;

  border:1px solid #333;

  border-radius:10px;

  padding:14px;

  margin-top:10px;
}

.drive-title{

  color:#ffd700;

  font-weight:bold;

  margin-bottom:6px;
}


/* =========================
   PDF LINK
========================= */

.pdf-link{

  display:none;

  margin-top:10px;

  color:#ffd700;

  word-break:break-all;

  font-size:12px;
}


/* =========================
   SAVE BUTTON
========================= */

.save-btn{

  width:100%;

  padding:15px;

  margin-top:25px;

  border:0;

  border-radius:9px;

  background:#16a34a;

  color:#fff;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;
}

.save-btn:disabled{

  opacity:.5;

  cursor:not-allowed;
}

</style>

</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

  <div class="logo">
    Road2Billionaire
  </div>


  <a
    href="ebook.html"
    class="back"
  >
    ← Back
  </a>

</div>



<!-- =========================
     CONTAINER
========================= -->

<div class="container">

<div class="card">


<h1>
  📚 Add New eBook
</h1>



<form id="bookForm">


<!-- =========================
     BOOK TITLE
========================= -->

<label>
  Book Title
</label>

<input
  type="text"
  id="title"
  placeholder="Enter book title"
  required
>



<!-- =========================
     DESCRIPTION
========================= -->

<label>
  Description
</label>

<textarea
  id="description"
  placeholder="Enter book description"
  required
></textarea>



<!-- =========================
     TOPICS
========================= -->

<label>
  Topics
</label>

<input
  type="text"
  id="topics"
  placeholder="Example: Business, Motivation, Success"
>



<!-- =========================
     PRICE
========================= -->

<label>
  Price (₹)
</label>

<input
  type="number"
  id="price"
  placeholder="Enter price"
  min="0"
  required
>



<!-- =========================
     OLD PRICE
========================= -->

<label>
  Old Price (₹)
</label>

<input
  type="number"
  id="oldPrice"
  placeholder="Optional"
  min="0"
>



<!-- =========================
     BOOK IMAGE
========================= -->

<label>
  🖼️ Book Image
</label>

<input
  type="file"
  id="imageFile"
  accept="image/*"
>


<button
  type="button"
  class="upload-btn"
  id="imageUploadBtn"
>
  🖼️ Upload Book Image
</button>


<div
  class="status"
  id="imageStatus"
>
  Image अभी upload नहीं हुई है।
</div>


<img
  id="imagePreview"
  class="preview"
  alt="Book Preview"
>



<!-- =========================
     GOOGLE DRIVE PDF
========================= -->

<label>
  📖 eBook PDF
</label>


<div class="drive-box">

  <div class="drive-title">
    📁 Google Drive PDF
  </div>

  <div class="small">

    पहले PDF को Google Drive में upload करें।

    <br>

    फिर:

    <strong>
      Share → General access → Anyone with the link → Viewer
    </strong>

    करें और नीचे उसका link paste करें।

  </div>

</div>


<input
  type="url"
  id="pdfUrl"
  placeholder="Paste Google Drive PDF link here"
  required
>


<button
  type="button"
  class="upload-btn"
  id="checkPdfBtn"
>
  🔗 Check Google Drive Link
</button>


<div
  class="status"
  id="pdfStatus"
>
  अभी कोई PDF link नहीं दिया गया है।
</div>


<div
  id="pdfLink"
  class="pdf-link"
>
</div>



<!-- =========================
     SAVE
========================= -->

<button
  type="submit"
  class="save-btn"
  id="saveBtn"
>
  💾 Save eBook
</button>


</form>

</div>

</div>



<script>


/* =====================================================
   CLOUDINARY SETTINGS
   केवल BOOK IMAGE के लिए
===================================================== */

const CLOUD_NAME =
  "z2kzpgl3";


const UPLOAD_PRESET =
  "road2billionaire";


const IMAGE_UPLOAD_URL =
  "https://api.cloudinary.com/v1_1/" +
  CLOUD_NAME +
  "/image/upload";



/* =====================================================
   ELEMENTS
===================================================== */

const imageFile =
  document.getElementById(
    "imageFile"
  );


const pdfUrl =
  document.getElementById(
    "pdfUrl"
  );


const imageUploadBtn =
  document.getElementById(
    "imageUploadBtn"
  );


const checkPdfBtn =
  document.getElementById(
    "checkPdfBtn"
  );


const imageStatus =
  document.getElementById(
    "imageStatus"
  );


const pdfStatus =
  document.getElementById(
    "pdfStatus"
  );


const imageUrl =
  document.getElementById(
    "imageUrl"
  );


const imagePreview =
  document.getElementById(
    "imagePreview"
  );


const pdfLink =
  document.getElementById(
    "pdfLink"
  );


const saveBtn =
  document.getElementById(
    "saveBtn"
  );



/* =====================================================
   IMAGE URL FIELD
===================================================== */

const hiddenImageUrl =
  document.createElement(
    "input"
  );


hiddenImageUrl.type =
  "hidden";


hiddenImageUrl.id =
  "imageUrl";


document
  .getElementById("bookForm")
  .appendChild(
    hiddenImageUrl
  );



/* =====================================================
   CLOUDINARY IMAGE UPLOAD
===================================================== */

async function uploadImageToCloudinary(
  file
){

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  const response =
    await fetch(
      IMAGE_UPLOAD_URL,
      {
        method:"POST",

        body:formData
      }
    );


  let data = {};

  try{

    data =
      await response.json();

  }

  catch(error){

    throw new Error(
      "Cloudinary ने valid response नहीं दिया।"
    );

  }


  if(!response.ok){

    throw new Error(
      data.error?.message ||
      "Image upload failed."
    );

  }


  if(!data.secure_url){

    throw new Error(
      "Cloudinary image URL नहीं मिला।"
    );

  }


  return data.secure_url;

}



/* =====================================================
   IMAGE UPLOAD BUTTON
===================================================== */

imageUploadBtn.addEventListener(
  "click",
  async function(){

    const file =
      imageFile.files[0];


    if(!file){

      alert(
        "पहले Book Image select करें।"
      );

      return;

    }


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      alert(
        "कृपया valid image select करें।"
      );

      return;

    }


    imageUploadBtn.disabled =
      true;


    imageStatus.innerHTML =
      "⏳ Image uploading...";


    try{

      const url =
        await uploadImageToCloudinary(
          file
        );


      hiddenImageUrl.value =
        url;


      imagePreview.src =
        url;


      imagePreview.style.display =
        "block";


      imageStatus.innerHTML =
        '<span class="success">' +
        '✅ Image uploaded successfully.' +
        '</span>';

    }

    catch(error){

      console.error(
        "IMAGE UPLOAD ERROR:",
        error
      );


      hiddenImageUrl.value =
        "";


      imageStatus.innerHTML =
        '<span class="error">' +
        '❌ Image upload failed:<br>' +
        escapeHTML(
          error.message
        ) +
        '</span>';

    }


    imageUploadBtn.disabled =
      false;

  }
);



/* =====================================================
   GOOGLE DRIVE LINK CHECK
===================================================== */

checkPdfBtn.addEventListener(
  "click",
  function(){

    const url =
      pdfUrl.value.trim();


    if(!url){

      pdfStatus.innerHTML =
        '<span class="error">' +
        '❌ पहले Google Drive PDF link डालें।' +
        '</span>';

      return;

    }


    if(!isGoogleDriveLink(url)){

      pdfStatus.innerHTML =
        '<span class="error">' +
        '❌ यह Google Drive link नहीं लग रहा है।' +
        '</span>';

      pdfLink.style.display =
        "none";

      return;

    }


    const driveViewURL =
      createGoogleDriveURL(
        url
      );


    pdfStatus.innerHTML =
      '<span class="success">' +
      '✅ Google Drive PDF link सही है।' +
      '</span>';


    pdfLink.innerHTML =
      "PDF Link:<br>" +
      escapeHTML(
        driveViewURL
      );


    pdfLink.style.display =
      "block";

  }
);



/* =====================================================
   GOOGLE DRIVE LINK VALIDATION
===================================================== */

function isGoogleDriveLink(url){

  try{

    const parsed =
      new URL(url);


    return (
      parsed.hostname ===
        "drive.google.com" ||

      parsed.hostname ===
        "www.drive.google.com" ||

      parsed.hostname ===
        "docs.google.com"
    );

  }

  catch(error){

    return false;

  }

}



/* =====================================================
   CREATE GOOGLE DRIVE VIEW URL
===================================================== */

function createGoogleDriveURL(
  url
){

  url =
    String(url).trim();


  /*
    Format:

    drive.google.com/file/d/FILE_ID/view
  */

  const fileMatch =
    url.match(
      /\/file\/d\/([^/]+)/
    );


  if(
    fileMatch &&
    fileMatch[1]
  ){

    return (
      "https://drive.google.com/file/d/" +
      fileMatch[1] +
      "/view"
    );

  }


  /*
    Format:

    drive.google.com/open?id=FILE_ID
  */

  const openMatch =
    url.match(
      /[?&]id=([^&]+)/
    );


  if(
    openMatch &&
    openMatch[1]
  ){

    return (
      "https://drive.google.com/file/d/" +
      openMatch[1] +
      "/view"
    );

  }


  /*
    If already usable
  */

  return url;

}



/* =====================================================
   SAVE EBOOK
===================================================== */

document
  .getElementById("bookForm")
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();


      /* =========================
         GET VALUES
      ========================= */

      const title =
        document.getElementById(
          "title"
        ).value.trim();


      const description =
        document.getElementById(
          "description"
        ).value.trim();


      const topics =
        document.getElementById(
          "topics"
        ).value.trim();


      const price =
        document.getElementById(
          "price"
        ).value.trim();


      const oldPrice =
        document.getElementById(
          "oldPrice"
        ).value.trim();


      const uploadedPDF =
        pdfUrl.value.trim();


      const uploadedImage =
        hiddenImageUrl.value.trim();



      /* =========================
         VALIDATION
      ========================= */

      if(!title){

        alert(
          "Book title डालें।"
        );

        return;

      }


      if(!description){

        alert(
          "Book description डालें।"
        );

        return;

      }


      if(!price){

        alert(
          "Book price डालें।"
        );

        return;

      }


      if(!uploadedPDF){

        alert(
          "Google Drive PDF link डालें।"
        );

        return;

      }


      if(!isGoogleDriveLink(
        uploadedPDF
      )){

        alert(
          "कृपया valid Google Drive PDF link डालें।"
        );

        return;

      }



      /* =========================
         LOAD EXISTING BOOKS
      ========================= */

      let ebooks = [];


      try{

        const saved =
          localStorage.getItem(
            "ebooksData"
          );


        if(saved){

          ebooks =
            JSON.parse(saved);

        }

      }

      catch(error){

        console.error(
          "ebooksData error:",
          error
        );

        ebooks = [];

      }


      if(!Array.isArray(
        ebooks
      )){

        ebooks = [];

      }



      /* =========================
         CREATE BOOK
      ========================= */

      const newBook = {

        id:
          Date.now().toString(),

        title:
          title,

        description:
          description,

        topics:
          topics,

        price:
          price,

        oldPrice:
          oldPrice,

        image:
          uploadedImage,

        /*
          Google Drive PDF link
        */

        pdfUrl:
          createGoogleDriveURL(
            uploadedPDF
          ),

        pdfSource:
          "google-drive",

        createdAt:
          new Date().toISOString()

      };



      /* =========================
         ADD BOOK
      ========================= */

      ebooks.push(
        newBook
      );



      /* =========================
         SAVE
      ========================= */

      try{

        localStorage.setItem(
          "ebooksData",
          JSON.stringify(
            ebooks
          )
        );

      }

      catch(error){

        console.error(
          error
        );

        alert(
          "❌ eBook save नहीं हो पाई।"
        );

        return;

      }



      /* =========================
         SUCCESS
      ========================= */

      alert(
        "✅ eBook successfully saved!"
      );


      window.location.href =
        "ebook.html";

    }
  );



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
