<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add eBook | Road2Billionaire</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.topbar{
  background:#111;
  padding:18px;
  border-bottom:1px solid #ffd700;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
}

.container{
  max-width:700px;
  margin:auto;
  padding:30px 18px;
}

h1{
  color:#ffd700;
  text-align:center;
  margin-bottom:25px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:22px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  color:#ddd;
}

input,
textarea{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #444;
  background:#050505;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#ffd700;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  margin-top:18px;
  padding:12px;
  border-radius:8px;
  display:none;
  text-align:center;
}

.success{
  background:#123d1c;
  color:#7dff91;
}

.error{
  background:#3d1212;
  color:#ff8b8b;
}

.note{
  margin-top:15px;
  padding:12px;
  background:#181818;
  border-radius:8px;
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="topbar">

  <div class="logo">
    Road2Billionaire
  </div>

  <a href="admin.html" class="back">
    ← Admin
  </a>

</div>

<div class="container">

<h1>📚 Add New eBook</h1>

<div class="card">

<form id="ebookForm">

<label>eBook Title</label>

<input
  type="text"
  id="title"
  placeholder="Money Management"
  required
>

<label>Description</label>

<textarea
  id="description"
  placeholder="Enter eBook description"
  required
></textarea>

<label>Topics / What You Will Learn</label>

<textarea
  id="topics"
  placeholder="Saving, Money Management, Investment"
  required
></textarea>

<label>Price (₹)</label>

<input
  type="number"
  id="price"
  placeholder="99"
  min="0"
  required
>

<label>Book Image URL</label>

<input
  type="url"
  id="image"
  placeholder="https://example.com/book.jpg"
>

<label>PDF / eBook Link</label>

<input
  type="url"
  id="pdfUrl"
  placeholder="https://example.com/book.pdf"
  required
>

<button type="submit" id="saveBtn">
  💾 Save eBook
</button>

<div id="message" class="message"></div>

<div class="note">
  <b>Important:</b> PDF URL में आपकी actual PDF की direct link होनी चाहिए.
  Example: https://example.com/book.pdf
</div>

</form>

</div>
</div>

<script>

/* ================================
   SAVE EBOOK
================================ */

const form = document.getElementById("ebookForm");
const saveBtn = document.getElementById("saveBtn");
const message = document.getElementById("message");

function showMessage(text, type){

  message.textContent = text;

  message.className = "message " + type;

  message.style.display = "block";
}


form.addEventListener("submit", function(e){

  e.preventDefault();

  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  try{

    const title =
      document.getElementById("title").value.trim();

    const description =
      document.getElementById("description").value.trim();

    const topics =
      document.getElementById("topics").value.trim();

    const price =
      Number(document.getElementById("price").value);

    const image =
      document.getElementById("image").value.trim();

    const pdfUrl =
      document.getElementById("pdfUrl").value.trim();


    if(!title || !description || !topics || !pdfUrl){

      throw new Error("Please fill all required fields.");

    }


    const ebooks =
      JSON.parse(localStorage.getItem("ebooks") || "[]");


    const ebook = {

      id: Date.now().toString(),

      title: title,

      description: description,

      topics: topics,

      price: price,

      image: image,

      pdfUrl: pdfUrl,

      createdAt: new Date().toISOString()

    };


    ebooks.push(ebook);


    localStorage.setItem(
      "ebooks",
      JSON.stringify(ebooks)
    );


    showMessage(
      "✅ eBook successfully added!",
      "success"
    );


    form.reset();


    setTimeout(function(){

      window.location.href = "admin.html";

    },1200);


  }catch(error){

    showMessage(
      "❌ " + error.message,
      "error"
    );

  }


  saveBtn.disabled = false;
  saveBtn.textContent = "💾 Save eBook";

});

</script>

</body>
</html>
