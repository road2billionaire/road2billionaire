<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add eBook | Road2Billionaire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #292000 0%, #0b0b0b 45%, #000 100%);
      color: white;
      min-height: 100vh;
    }

    .topbar {
      background: #111;
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      color: #ffd700;
      font-size: 21px;
      font-weight: bold;
    }

    .back {
      color: #ffd700;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    .box {
      background: #111;
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.08);
    }

    h1 {
      color: #ffd700;
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      color: #888;
      text-align: center;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      background: #1d1d1d;
      border: 1px solid #444;
      border-radius: 10px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ffd700;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #ffd700, #ffb700);
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .success {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #123d20;
      color: #6dff91;
      text-align: center;
    }

    @media (max-width: 550px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">

    <div class="brand">
      Road2Billionaire
    </div>

    <a href="admin.html" class="back">
      ← Admin Panel
    </a>

  </div>


  <div class="container">

    <div class="box">

      <h1>📚 Add New eBook</h1>

      <div class="subtitle">
        Add your eBook details to the admin system.
      </div>


      <form onsubmit="addEbook(event)">

        <label>eBook Title</label>

        <input
          type="text"
          id="title"
          placeholder="Example: Money Management"
          required
        >


        <label>Description</label>

        <textarea
          id="description"
          placeholder="Enter eBook description"
          required
        ></textarea>


        <label>Topics / What You Will Learn</label>

        <textarea
          id="topics"
          placeholder="Example: Budgeting, Saving, Investing..."
          required
        ></textarea>


        <div class="row">

          <div>
            <label>Price (₹)</label>

            <input
              type="number"
              id="price"
              placeholder="99"
              min="0"
              required
            >
          </div>


          <div>
            <label>Old Price (₹)</label>

            <input
              type="number"
              id="oldPrice"
              placeholder="199"
              min="0"
            >
          </div>

        </div>


        <label>eBook PDF / File Link</label>

        <input
          type="text"
          id="pdfLink"
          placeholder="Enter PDF link later"
        >


        <button type="submit" class="btn">
          ➕ Add eBook
        </button>

      </form>


      <div id="success" class="success">
        ✅ eBook details saved successfully!
      </div>

    </div>

  </div>


  <script>

    function addEbook(event) {

      event.preventDefault();

      const ebook = {

        title:
          document.getElementById("title").value.trim(),

        description:
          document.getElementById("description").value.trim(),

        topics:
          document.getElementById("topics").value.trim(),

        price:
          document.getElementById("price").value,

        oldPrice:
          document.getElementById("oldPrice").value,

        pdfLink:
          document.getElementById("pdfLink").value.trim()

      };


      /*
        Demo storage only.
        Later this will be replaced by
        a real database/backend.
      */

      localStorage.setItem(
        "ebookData",
        JSON.stringify(ebook)
      );


      document.getElementById(
        "success"
      ).style.display = "block";


      setTimeout(function() {

        window.location.href = "admin.html";

      }, 2000);

    }

  </script>

</body>
</html>
