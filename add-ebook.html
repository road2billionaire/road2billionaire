<script>

function addEbook(event) {
  event.preventDefault();

  const ebook = {
    id: Date.now(),
    title: document.getElementById("title").value.trim(),
    description: document.getElementById("description").value.trim(),
    topics: document.getElementById("topics").value.trim(),
    price: document.getElementById("price").value,
    oldPrice: document.getElementById("oldPrice").value,
    fileLink: document.getElementById("fileLink").value.trim()
  };

  let ebooks = [];

  try {
    const saved = localStorage.getItem("ebooksData");

    if (saved) {
      ebooks = JSON.parse(saved);
    }

    if (!Array.isArray(ebooks)) {
      ebooks = [];
    }

  } catch (error) {
    ebooks = [];
  }

  ebooks.push(ebook);

  localStorage.setItem("ebooksData", JSON.stringify(ebooks));

  alert("✅ eBook successfully added!");

  window.location.href = "ebook.html?v=" + Date.now();
}

</script>
