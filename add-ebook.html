<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add eBook | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.topbar{
  background:#111;
  border-bottom:1px solid #ffd700;
  padding:16px 18px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#ffd700;
  font-size:21px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  background:#222;
  text-decoration:none;
  padding:9px 14px;
  border-radius:7px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:25px 18px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
}

h1{
  color:#ffd700;
  margin-top:0;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  color:#ddd;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #444;
  background:#222;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.upload-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#ffd700;
  color:#000;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  margin-top:5px;
}

.upload-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  margin-top:10px;
  padding:10px;
  border-radius:7px;
  background:#181818;
  color:#aaa;
  font-size:14px;
  word-break:break-word;
}

.success{
  color:#7dff91;
}

.error{
  color:#ff5555;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  background:#222;
  border-radius:10px;
  margin-top:12px;
  display:none;
}

.save-btn{
  width:100%;
  padding:15px;
  margin-top:25px;
  border:0;
  border-radius:9px;
  background:#16a34a;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.save-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.small{
  color:#777;
  font-size:12px;
  margin-top:6px;
}

</style>

</head>


<body>


<div class="topbar">

  <div class="logo">
    Road2Billionaire
  </div>

  <a
    href="ebook.html"
    class="back"
  >
    ← Back
  </a>

</div>


<div class="container">

<div class="card">

<h1>
  📚 Add New eBook
</h1>


<form id="bookForm">


<!-- BOOK TITLE -->

<label>
  Book Title
</label>

<input
  type="text"
  id="title"
  placeholder="Enter book title"
  required
>


<!-- DESCRIPTION -->

<label>
  Description
</label>

<textarea
  id="description"
  placeholder="Enter book description"
  required
></textarea>


<!-- TOPICS -->

<label>
  Topics
</label>

<input
  type="text"
  id="topics"
  placeholder="Example: Business, Motivation, Success"
>


<!-- PRICE -->

<label>
  Price (₹)
</label>

<input
  type="number"
  id="price"
  placeholder="Enter price"
  min="0"
  required
>


<!-- OLD PRICE -->

<label>
  Old Price (₹)
</label>

<input
  type="number"
  id="oldPrice"
  placeholder="Optional"
  min="0"
>


<!-- BOOK IMAGE -->

<label>
  🖼️ Book Image
</label>

<input
  type="file"
  id="imageFile"
  accept="image/*"
>

<button
  type="button"
  class="upload-btn"
  id="imageUploadBtn"
>
  🖼️ Upload Book Image
</button>

<div
  class="status"
  id="imageStatus"
>
  Image अभी upload नहीं हुई है।
</div>

<img
  id="imagePreview"
  class="preview"
  alt="Book Preview"
>


<!-- PDF -->

<label>
  📖 eBook PDF
</label>

<input
  type="file"
  id="pdfFile"
  accept="application/pdf"
>

<button
  type="button"
  class="upload-btn"
  id="pdfUploadBtn"
>
  📤 Upload PDF
</button>

<div
  class="status"
  id="pdfStatus"
>
  PDF अभी upload नहीं हुई है।
</div>


<!-- HIDDEN URL FIELDS -->

<input
  type="hidden"
  id="imageUrl"
>

<input
  type="hidden"
  id="pdfUrl"
>


<button
  type="submit"
  class="save-btn"
  id="saveBtn"
>
  💾 Save eBook
</button>


</form>

</div>

</div>


<script>


/* =====================================
   CLOUDINARY SETTINGS
===================================== */


const CLOUD_NAME =
  "z2kzpgl3";


const UPLOAD_PRESET =
  "road2billionaire";


const UPLOAD_URL =
  "https://api.cloudinary.com/v1_1/" +
  CLOUD_NAME +
  "/upload";


/* =====================================
   ELEMENTS
===================================== */


const imageFile =
  document.getElementById(
    "imageFile"
  );


const pdfFile =
  document.getElementById(
    "pdfFile"
  );


const imageUploadBtn =
  document.getElementById(
    "imageUploadBtn"
  );


const pdfUploadBtn =
  document.getElementById(
    "pdfUploadBtn"
  );


const imageStatus =
  document.getElementById(
    "imageStatus"
  );


const pdfStatus =
  document.getElementById(
    "pdfStatus"
  );


const imageUrl =
  document.getElementById(
    "imageUrl"
  );


const pdfUrl =
  document.getElementById(
    "pdfUrl"
  );


const imagePreview =
  document.getElementById(
    "imagePreview"
  );


const saveBtn =
  document.getElementById(
    "saveBtn"
  );


/* =====================================
   UPLOAD FUNCTION
===================================== */


async function uploadToCloudinary(
  file,
  type
){

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  /*
    PDFs should be uploaded as raw
    files so their original format
    is preserved.
  */

  if(type === "pdf"){

    formData.append(
      "resource_type",
      "raw"
    );

  }


  const response =
    await fetch(
      UPLOAD_URL,
      {
        method:"POST",
        body:formData
      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data.error?.message ||
      "Upload failed"
    );

  }


  return data.secure_url;

}


/* =====================================
   IMAGE UPLOAD
===================================== */


imageUploadBtn.addEventListener(
  "click",
  async function(){

    const file =
      imageFile.files[0];


    if(!file){

      alert(
        "पहले Book Image select करें।"
      );

      return;

    }


    imageUploadBtn.disabled =
      true;


    imageStatus.innerHTML =
      "⏳ Image uploading...";


    try{

      const url =
        await uploadToCloudinary(
          file,
          "image"
        );


      imageUrl.value =
        url;


      imagePreview.src =
        url;


      imagePreview.style.display =
        "block";


      imageStatus.innerHTML =
        '<span class="success">✅ Image uploaded successfully.</span>';


    }
    catch(error){

      console.error(error);


      imageStatus.innerHTML =
        '<span class="error">❌ Image upload failed: ' +
        error.message +
        '</span>';

    }


    imageUploadBtn.disabled =
      false;

  }
);


/* =====================================
   PDF UPLOAD
===================================== */


pdfUploadBtn.addEventListener(
  "click",
  async function(){

    const file =
      pdfFile.files[0];


    if(!file){

      alert(
        "पहले PDF select करें।"
      );

      return;

    }


    if(
      file.type !==
      "application/pdf"
    ){

      alert(
        "कृपया सिर्फ PDF file select करें।"
      );

      return;

    }


    pdfUploadBtn.disabled =
      true;


    saveBtn.disabled =
      true;


    pdfStatus.innerHTML =
      "⏳ PDF uploading...";


    try{

      const url =
        await uploadToCloudinary(
          file,
          "pdf"
        );


      pdfUrl.value =
        url;


      pdfStatus.innerHTML =
        '<span class="success">✅ PDF uploaded successfully.</span><br>' +
        '<span class="small">PDF website में save होने के लिए ready है.</span>';


    }
    catch(error){

      console.error(error);


      pdfStatus.innerHTML =
        '<span class="error">❌ PDF upload failed: ' +
        error.message +
        '</span>';

    }


    pdfUploadBtn.disabled =
      false;


    saveBtn.disabled =
      false;

  }
);


/* =====================================
   SAVE BOOK
===================================== */


document
  .getElementById("bookForm")
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();


      const title =
        document.getElementById(
          "title"
        ).value.trim();


      const description =
        document.getElementById(
          "description"
        ).value.trim();


      const topics =
        document.getElementById(
          "topics"
        ).value.trim();


      const price =
        document.getElementById(
          "price"
        ).value.trim();


      const oldPrice =
        document.getElementById(
          "oldPrice"
        ).value.trim();


      const uploadedPDF =
        pdfUrl.value.trim();


      const uploadedImage =
        imageUrl.value.trim();


      if(!title){

        alert(
          "Book title डालें।"
        );

        return;

      }


      if(!price){

        alert(
          "Book price डालें।"
        );

        return;

      }


      if(!uploadedPDF){

        alert(
          "पहले PDF upload करें।"
        );

        return;

      }


      let ebooks = [];


      try{

        const saved =
          localStorage.getItem(
            "ebooksData"
          );


        if(saved){

          ebooks =
            JSON.parse(saved);

        }

      }
      catch(error){

        ebooks = [];

      }


      if(!Array.isArray(ebooks)){

        ebooks = [];

      }


      const newBook = {

        id:
          Date.now().toString(),

        title:
          title,

        description:
          description,

        topics:
          topics,

        price:
          price,

        oldPrice:
          oldPrice,

        image:
          uploadedImage,

        pdfUrl:
          uploadedPDF,

        createdAt:
          new Date().toISOString()

      };


      ebooks.push(
        newBook
      );


      localStorage.setItem(
        "ebooksData",
        JSON.stringify(ebooks)
      );


      alert(
        "✅ eBook successfully saved!"
      );


      window.location.href =
        "ebook.html";

    }
  );


</script>


</body>

</html>
