<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Read eBook | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  background:#000;
  border-bottom:1px solid #ffd700;

  min-height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 15px;

  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  color:#ffd700;
  font-size:20px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
  background:#222;

  padding:9px 14px;

  border-radius:7px;

  font-size:14px;
}

.back:hover{
  background:#333;
}


/* =========================
   BOOK TITLE
========================= */

#bookTitle{
  text-align:center;

  background:#181818;

  color:#fff;

  padding:13px 10px;

  font-size:17px;

  font-weight:bold;

  border-bottom:1px solid #333;
}


/* =========================
   CUSTOM BUTTON AREA
========================= */

.custom-actions{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  padding:10px;

  background:#111;

  border-bottom:1px solid #333;

}


/* =========================
   CUSTOM DRIVE BUTTON
========================= */

.drive-button{

  display:inline-block;

  background:#ffd700;

  color:#000;

  text-decoration:none;

  padding:8px 14px;

  border-radius:7px;

  font-size:13px;

  font-weight:bold;

  border:1px solid #ffd700;

  cursor:pointer;

}

.drive-button:hover{

  background:#e6c200;

}


/* =========================
   LOADING
========================= */

#loading{

  text-align:center;

  padding:40px 20px;

  color:#ffd700;

  font-size:17px;

}


/* =========================
   ERROR
========================= */

#error{

  display:none;

  max-width:600px;

  margin:30px auto;

  padding:25px 20px;

  text-align:center;

  background:#181818;

  border:1px solid #333;

  border-radius:12px;

  color:#ff6b6b;

  line-height:1.7;

}


/* =========================
   PDF READER
========================= */

#reader{

  display:none;

  width:100%;

  padding:5px;

}

#pdfFrame{

  display:block;

  width:100%;

  height:calc(100vh - 165px);

  min-height:600px;

  border:0;

  background:#fff;

  border-radius:4px;

}


/* =========================
   NOTE
========================= */

.note{

  text-align:center;

  color:#777;

  font-size:11px;

  padding:8px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{

    min-height:55px;

    padding:8px 10px;

  }

  .logo{

    font-size:17px;

  }

  .back{

    font-size:13px;

    padding:8px 11px;

  }

  #bookTitle{

    font-size:15px;

    padding:12px 8px;

  }

  .custom-actions{

    padding:8px;

  }

  .drive-button{

    padding:7px 12px;

    font-size:12px;

  }

  #pdfFrame{

    height:calc(100vh - 150px);

    min-height:500px;

  }

}

</style>

</head>

<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

  <div class="logo">

    📚 Road2Billionaire

  </div>


  <a
    href="Dashboard.html"
    class="back"
  >

    ← Back

  </a>

</div>


<!-- =========================
     BOOK TITLE
========================= -->

<div id="bookTitle">

  Loading eBook...

</div>


<!-- =========================
     CUSTOM BUTTON
========================= -->

<div
  id="customActions"
  class="custom-actions"
  style="display:none;"
>

  <a
    id="driveButton"
    class="drive-button"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
  >

    ↗ Open PDF

  </a>

</div>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

  📖 PDF load ho rahi hai...

</div>


<!-- =========================
     ERROR
========================= -->

<div id="error">

  ❌ PDF open nahi ho paayi.

</div>


<!-- =========================
     PDF READER
========================= -->

<div id="reader">

  <iframe
    id="pdfFrame"
    title="eBook PDF"
  ></iframe>


  <div class="note">

    🔒 Purchased eBook • Road2Billionaire

  </div>

</div>


<script>


/* =================================
   GET URL ID
================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const bookId =
  params.get("id");


/* =================================
   ELEMENTS
================================= */

const title =
  document.getElementById(
    "bookTitle"
  );


const loading =
  document.getElementById(
    "loading"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const reader =
  document.getElementById(
    "reader"
  );


const pdfFrame =
  document.getElementById(
    "pdfFrame"
  );


const customActions =
  document.getElementById(
    "customActions"
  );


const driveButton =
  document.getElementById(
    "driveButton"
  );


/* =================================
   SHOW ERROR
================================= */

function showError(message){

  loading.style.display =
    "none";

  reader.style.display =
    "none";

  customActions.style.display =
    "none";

  errorBox.style.display =
    "block";

  errorBox.innerHTML =
    message;

}


/* =================================
   LOAD EBOOK DATA
================================= */

let books = [];


try{

  const saved =
    localStorage.getItem(
      "ebooksData"
    );


  if(saved){

    books =
      JSON.parse(saved);

  }

}

catch(error){

  console.error(
    "ebooksData error:",
    error
  );

  books = [];

}


if(!Array.isArray(books)){

  books = [];

}


/* =================================
   LOAD PURCHASE DATA
================================= */

let purchases = [];


try{

  const saved =
    localStorage.getItem(
      "purchasedBooks"
    );


  if(saved){

    purchases =
      JSON.parse(saved);

  }

}

catch(error){

  console.error(
    "purchasedBooks error:",
    error
  );

  purchases = [];

}


if(!Array.isArray(purchases)){

  purchases = [];

}


/* =================================
   CHECK BOOK ID
================================= */

if(!bookId){

  showError(

    "❌ eBook ID नहीं मिला।<br><br>" +

    "कृपया eBook को Read button से खोलें।"

  );

}


/* =================================
   FIND BOOK
================================= */

else{

  const book =
    books.find(function(item){

      return String(item.id) ===
             String(bookId);

    });


  /* ===============================
     BOOK NOT FOUND
  =============================== */

  if(!book){

    showError(

      "❌ eBook नहीं मिली।<br><br>" +

      "Book ID: " +

      bookId

    );

  }


  /* ===============================
     BOOK FOUND
  =============================== */

  else{

    title.innerText =
      book.title ||
      "eBook";


    /* =============================
       CHECK PURCHASE
    ============================= */

    const purchased =
      purchases.some(function(item){

        if(

          typeof item === "object" &&

          item !== null

        ){

          return String(item.bookId) ===
                 String(book.id);

        }


        return String(item) ===
               String(book.id);

      });


    /* =============================
       NOT PURCHASED
    ============================= */

    if(!purchased){

      showError(

        "🔒 यह eBook purchased नहीं है।<br><br>" +

        "पहले eBook purchase करें।"

      );

    }


    /* =============================
       PDF LINK MISSING
    ============================= */

    else if(!book.pdfUrl){

      showError(

        "❌ इस eBook का PDF link उपलब्ध नहीं है।<br><br>" +

        "Admin panel में Google Drive link check करें।"

      );

    }


    /* =============================
       OPEN PDF
    ============================= */

    else{

      openPDF(
        book.pdfUrl
      );

    }

  }

}


/* =================================
   OPEN PDF
================================= */

function openPDF(url){

  const fileId =
    getDriveFileId(url);


  if(!fileId){

    showError(

      "❌ Google Drive link सही नहीं है।<br><br>" +

      "Admin panel में पूरा Google Drive PDF link डालें।"

    );

    return;

  }


  /* =============================
     GOOGLE DRIVE PREVIEW
  ============================= */

  const previewURL =

    "https://drive.google.com/file/d/" +

    encodeURIComponent(fileId) +

    "/preview";


  /* =============================
     GOOGLE DRIVE NORMAL LINK
  ============================= */

  const driveURL =

    "https://drive.google.com/file/d/" +

    encodeURIComponent(fileId) +

    "/view";


  /* =============================
     SET IFRAME
  ============================= */

  pdfFrame.src =
    previewURL;


  /* =============================
     CUSTOM BUTTON
  ============================= */

  driveButton.href =
    driveURL;


  customActions.style.display =
    "flex";


  /* =============================
     SHOW READER
  ============================= */

  loading.style.display =
    "none";


  reader.style.display =
    "block";

}


/* =================================
   GET DRIVE FILE ID
================================= */

function getDriveFileId(url){

  try{

    const text =
      String(url).trim();


    /* =============================
       FORMAT:

       /file/d/FILE_ID/view
    ============================= */

    let match =
      text.match(

        /drive\.google\.com\/file\/d\/([^\/?#]+)/

      );


    if(
      match &&
      match[1]
    ){

      return match[1];

    }


    /* =============================
       FORMAT:

       /open?id=FILE_ID
    ============================= */

    if(
      text.includes(
        "drive.google.com"
      )
    ){

      const parsed =
        new URL(text);


      const id =
        parsed.searchParams.get(
          "id"
        );


      if(id){

        return id;

      }

    }


    return null;

  }

  catch(error){

    console.error(
      "Drive ID Error:",
      error
    );

    return null;

  }

}


/* =================================
   BASIC PROTECTION
================================= */

document.addEventListener(

  "contextmenu",

  function(e){

    e.preventDefault();

  }

);

</script>

</body>

</html>
