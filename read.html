<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Read eBook - Road2Billionaire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .topbar {
      background: #000;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #ffd700;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    #bookTitle {
      text-align: center;
      padding: 12px;
      font-size: 18px;
      background: #181818;
    }

    #loading {
      text-align: center;
      padding: 30px;
      font-size: 18px;
    }

    #error {
      display: none;
      text-align: center;
      padding: 30px 20px;
      color: #ff6b6b;
      font-size: 17px;
    }

    .page {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 15px auto;
      background: white;
    }

    #viewer {
      padding-bottom: 30px;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 15px auto;
      padding: 10px 18px;
      background: #ffd700;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

  <div class="topbar">
    📚 Road2Billionaire
  </div>

  <div id="bookTitle">
    Loading eBook...
  </div>

  <div id="loading">
    📖 PDF load ho rahi hai...
  </div>

  <div id="error">
    ❌ PDF open nahi ho paayi.<br><br>
    Please PDF ko dobara upload karke try karein.
  </div>

  <div id="viewer"></div>

  <a href="ebook.html" class="back">
    ← Back to eBooks
  </a>

  <script>

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("id");

    const books = JSON.parse(
      localStorage.getItem("ebooksData") || "[]"
    );

    const purchases = JSON.parse(
      localStorage.getItem("purchasedBooks") || "[]"
    );

    const book = books.find(
      b => String(b.id) === String(bookId)
    );

    // Book check
    if (!book) {

      document.getElementById("loading").style.display = "none";

      document.getElementById("error").style.display = "block";

      document.getElementById("error").innerHTML =
        "❌ eBook nahi mili.";

    }

    // Purchase check
    else if (!purchases.includes(String(bookId)) &&
             !purchases.includes(bookId)) {

      document.getElementById("loading").style.display = "none";

      document.getElementById("error").style.display = "block";

      document.getElementById("error").innerHTML =
        "🔒 Ye eBook purchased nahi hai.<br><br>" +
        "Pehle eBook purchase karein.";

    }

    else {

      document.getElementById("bookTitle").innerText =
        book.title || "eBook";

      const pdfUrl = book.pdfUrl;

      if (!pdfUrl) {

        document.getElementById("loading").style.display = "none";

        document.getElementById("error").style.display = "block";

        document.getElementById("error").innerHTML =
          "❌ Is eBook ka PDF URL nahi mila.";

      } else {

        console.log("PDF URL:", pdfUrl);

        loadPDF(pdfUrl);
      }
    }


    async function loadPDF(url) {

      try {

        const loadingTask = pdfjsLib.getDocument({
          url: url,
          withCredentials: false
        });

        const pdf = await loadingTask.promise;

        document.getElementById("loading").style.display = "none";

        const viewer = document.getElementById("viewer");

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

          const page = await pdf.getPage(pageNumber);

          const viewport = page.getViewport({
            scale: 1.5
          });

          const canvas = document.createElement("canvas");

          canvas.className = "page";

          const context = canvas.getContext("2d");

          canvas.width = viewport.width;
          canvas.height = viewport.height;

          viewer.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        }

      } catch (error) {

        console.error("PDF ERROR:", error);

        document.getElementById("loading").style.display = "none";

        document.getElementById("error").style.display = "block";

        document.getElementById("error").innerHTML =
          "❌ PDF open nahi ho paayi.<br><br>" +
          "Cloudinary PDF loading error.";
      }
    }


    // Right click disable
    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });


    // Text selection disable
    document.addEventListener("selectstart", function(e) {
      e.preventDefault();
    });


    // Keyboard shortcuts block
    document.addEventListener("keydown", function(e) {

      if (
        (e.ctrlKey || e.metaKey) &&
        ["s", "p", "u", "c"].includes(e.key.toLowerCase())
      ) {
        e.preventDefault();
      }

    });

  </script>

</body>
</html>
