<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Read eBook | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

.topbar{
  background:#111;
  border-bottom:1px solid #ffd700;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#ffd700;
  font-size:20px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
  background:#222;
  padding:9px 14px;
  border-radius:7px;
}

.title{
  text-align:center;
  color:#ffd700;
  padding:15px 10px;
  font-size:20px;
}

.reader{
  width:100%;
  height:calc(100vh - 125px);
  background:#222;
  position:relative;
  overflow:hidden;
}

iframe{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.message{
  text-align:center;
  padding:40px 20px;
}

.error{
  color:#ff5555;
}

.loading{
  color:#ffd700;
}

</style>

</head>


<body>


<div class="topbar">

  <div class="logo">
    Road2Billionaire
  </div>

  <a
    href="Dashboard.html?v=300001"
    class="back"
  >
    ← Back
  </a>

</div>


<div
  class="title"
  id="bookTitle"
>
  📖 Loading eBook...
</div>


<div
  class="reader"
  id="reader"
>

  <div class="message loading">
    Please wait...
  </div>

</div>


<script>


(function(){


  /* =========================
     GET BOOK ID
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  const title =
    document.getElementById(
      "bookTitle"
    );

  const reader =
    document.getElementById(
      "reader"
    );


  if(!id){

    title.textContent =
      "❌ eBook Not Found";

    reader.innerHTML = `

      <div class="message">

        <p class="error">
          eBook ID नहीं मिला।
        </p>

      </div>

    `;

    return;

  }


  /* =========================
     LOAD EBOOK DATA
  ========================= */

  let ebooks = [];

  try{

    const saved =
      localStorage.getItem(
        "ebooksData"
      );

    if(saved){

      ebooks =
        JSON.parse(saved);

    }

  }
  catch(error){

    ebooks = [];

  }


  if(!Array.isArray(ebooks)){

    ebooks = [];

  }


  /* =========================
     FIND BOOK
  ========================= */

  const book =
    ebooks.find(function(item){

      return String(item.id) ===
             String(id);

    });


  if(!book){

    title.textContent =
      "❌ eBook Not Found";

    reader.innerHTML = `

      <div class="message">

        <p class="error">
          यह eBook इस browser में उपलब्ध नहीं है।
        </p>

      </div>

    `;

    return;

  }


  /* =========================
     CHECK PURCHASE
  ========================= */

  let purchasedBooks = [];

  try{

    const savedPurchased =
      localStorage.getItem(
        "purchasedBooks"
      );

    if(savedPurchased){

      purchasedBooks =
        JSON.parse(savedPurchased);

    }

  }
  catch(error){

    purchasedBooks = [];

  }


  if(!Array.isArray(purchasedBooks)){

    purchasedBooks = [];

  }


  const purchased =
    purchasedBooks.some(function(item){

      return String(item.bookId) ===
             String(book.id);

    });


  /* =========================
     PURCHASE CHECK
  ========================= */

  if(!purchased){

    title.textContent =
      "🔒 eBook Locked";

    reader.innerHTML = `

      <div class="message">

        <h2>
          🔒 यह eBook Purchased नहीं है
        </h2>

        <p>
          पहले eBook खरीदें, उसके बाद इसे पढ़ सकते हैं।
        </p>

        <a
          href="ebook-details.html?id=${encodeURIComponent(book.id)}"
          style="
            display:inline-block;
            margin-top:15px;
            padding:12px 20px;
            background:#ffd700;
            color:#000;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
          "
        >
          🛒 Buy Now
        </a>

      </div>

    `;

    return;

  }


  /* =========================
     CHECK PDF LINK
  ========================= */

  if(!book.pdfUrl){

    title.textContent =
      "❌ PDF Not Available";

    reader.innerHTML = `

      <div class="message">

        <p class="error">
          इस eBook की PDF उपलब्ध नहीं है।
        </p>

      </div>

    `;

    return;

  }


  /* =========================
     TITLE
  ========================= */

  title.textContent =
    "📖 " +
    (book.title || "Read eBook");


  /* =========================
     GOOGLE DRIVE PDF
  ========================= */

  let pdfUrl =
    book.pdfUrl;


  /*
    If Google Drive file ID is used,
    convert it to preview URL.
  */

  const driveMatch =
    pdfUrl.match(
      /\/file\/d\/([^/]+)/
    );


  if(driveMatch){

    const fileId =
      driveMatch[1];

    pdfUrl =
      "https://drive.google.com/file/d/" +
      fileId +
      "/preview";

  }


  /*
    If direct Google Drive download
    URL is being used.
  */

  const downloadMatch =
    pdfUrl.match(
      /[?&]id=([^&]+)/
    );


  if(
    pdfUrl.includes(
      "drive.google.com/uc"
    )
    &&
    downloadMatch
  ){

    const fileId =
      downloadMatch[1];

    pdfUrl =
      "https://drive.google.com/file/d/" +
      fileId +
      "/preview";

  }


  /* =========================
     PDF READER
  ========================= */

  reader.innerHTML = `

    <iframe
      src="${pdfUrl}"
      allow="autoplay"
      loading="eager"
      title="eBook Reader"
    ></iframe>

  `;


})();


/* =========================
   DISABLE RIGHT CLICK
========================= */

document.addEventListener(
  "contextmenu",
  function(event){

    event.preventDefault();

  }
);


/* =========================
   DISABLE SOME SHORTCUTS
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      (event.ctrlKey || event.metaKey)
      &&
      (
        event.key === "s" ||
        event.key === "p" ||
        event.key === "u"
      )
    ){

      event.preventDefault();

    }

  }
);

</script>


</body>

</html>
