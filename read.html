<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Read eBook | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.topbar{
  height:58px;
  background:#111;
  border-bottom:1px solid #ffd700;
  padding:0 15px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#ffd700;
  font-size:19px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;
  background:#222;
  padding:8px 13px;
  border-radius:7px;
  font-size:14px;
}

.title{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;

  color:#ffd700;
  background:#181818;

  padding:5px 40px;

  font-size:18px;
  font-weight:bold;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.reader{
  width:100%;
  height:calc(100vh - 110px);
  overflow:auto;
  background:#333;
  padding:15px 0;
}

#pdfContainer{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

.pdf-page{
  display:block;
  background:#fff;
  box-shadow:0 2px 10px #000;
  max-width:96%;
  height:auto;
}

.message{
  text-align:center;
  padding:50px 20px;
}

.error{
  color:#ff5555;
}

.loading{
  color:#ffd700;
}

.notice{
  color:#aaa;
  font-size:13px;
  margin-top:15px;
}

button{
  padding:12px 20px;
  border:0;
  border-radius:8px;
  background:#ffd700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

</style>

</head>


<body>


<div class="topbar">

  <div class="logo">
    Road2Billionaire
  </div>

  <a
    href="Dashboard.html"
    class="back"
  >
    ← Back
  </a>

</div>


<div
  class="title"
  id="bookTitle"
>
  📖 Loading eBook...
</div>


<div
  class="reader"
  id="reader"
>

  <div class="message loading">
    Please wait...
  </div>

</div>


<!-- PDF.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>

(function(){


  /* =========================
     PDF.JS WORKER
  ========================= */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* =========================
     GET BOOK ID
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  const title =
    document.getElementById(
      "bookTitle"
    );

  const reader =
    document.getElementById(
      "reader"
    );


  if(!id){

    title.textContent =
      "❌ eBook Not Found";

    reader.innerHTML = `

      <div class="message">

        <p class="error">
          eBook ID नहीं मिला।
        </p>

      </div>

    `;

    return;

  }


  /* =========================
     LOAD EBOOK DATA
  ========================= */

  let ebooks = [];

  try{

    const saved =
      localStorage.getItem(
        "ebooksData"
      );

    if(saved){

      ebooks =
        JSON.parse(saved);

    }

  }
  catch(error){

    ebooks = [];

  }


  if(!Array.isArray(ebooks)){

    ebooks = [];

  }


  /* =========================
     FIND BOOK
  ========================= */

  const book =
    ebooks.find(function(item){

      return String(item.id) ===
             String(id);

    });


  if(!book){

    title.textContent =
      "❌ eBook Not Found";

    reader.innerHTML = `

      <div class="message">

        <p class="error">
          यह eBook इस browser में उपलब्ध नहीं है।
        </p>

      </div>

    `;

    return;

  }


  /* =========================
     CHECK PURCHASE
  ========================= */

  let purchasedBooks = [];

  try{

    const savedPurchased =
      localStorage.getItem(
        "purchasedBooks"
      );

    if(savedPurchased){

      purchasedBooks =
        JSON.parse(savedPurchased);

    }

  }
  catch(error){

    purchasedBooks = [];

  }


  if(!Array.isArray(purchasedBooks)){

    purchasedBooks = [];

  }


  const purchased =
    purchasedBooks.some(function(item){

      return String(item.bookId) ===
             String(book.id);

    });


  /* =========================
     PURCHASE CHECK
  ========================= */

  if(!purchased){

    title.textContent =
      "🔒 eBook Locked";

    reader.innerHTML = `

      <div class="message">

        <h2>
          🔒 eBook Locked
        </h2>

        <p>
          पहले eBook खरीदें, उसके बाद इसे पढ़ सकते हैं।
        </p>

        <br>

        <a
          href="ebook-details.html?id=${encodeURIComponent(book.id)}"
        >
          <button>
            🛒 Buy Now
          </button>
        </a>

      </div>

    `;

    return;

  }


  /* =========================
     CHECK PDF
  ========================= */

  if(!book.pdfUrl){

    title.textContent =
      "❌ PDF Not Available";

    reader.innerHTML = `

      <div class="message">

        <p class="error">
          इस eBook की PDF उपलब्ध नहीं है।
        </p>

      </div>

    `;

    return;

  }


  title.textContent =
    "📖 " +
    (book.title || "Read eBook");


  /* =========================
     GET PDF URL
  ========================= */

  let pdfUrl =
    book.pdfUrl;


  /*
    Google Drive FILE URL
  */

  let driveMatch =
    pdfUrl.match(
      /\/file\/d\/([^/]+)/
    );


  /*
    Google Drive UC URL
  */

  if(!driveMatch){

    const downloadMatch =
      pdfUrl.match(
        /[?&]id=([^&]+)/
      );

    if(
      pdfUrl.includes(
        "drive.google.com"
      )
      &&
      downloadMatch
    ){

      driveMatch = [
        "",
        downloadMatch[1]
      ];

    }

  }


  /*
    Convert Google Drive
    to downloadable PDF URL
  */

  if(driveMatch){

    const fileId =
      driveMatch[1];

    pdfUrl =
      "https://drive.google.com/uc?export=download&id=" +
      fileId;

  }


  /* =========================
     START PDF
  ========================= */

  loadPDF(pdfUrl);


  async function loadPDF(url){

    try{

      reader.innerHTML = `

        <div
          class="message loading"
          id="loading"
        >
          📖 PDF Loading...
        </div>

        <div id="pdfContainer"></div>

      `;


      const loadingTask =
        pdfjsLib.getDocument({
          url:url,
          withCredentials:false
        });


      const pdf =
        await loadingTask.promise;


      const container =
        document.getElementById(
          "pdfContainer"
        );


      const loading =
        document.getElementById(
          "loading"
        );


      if(loading){

        loading.remove();

      }


      /*
        Render every page
      */

      for(
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ){

        const page =
          await pdf.getPage(
            pageNumber
          );


        const viewport =
          page.getViewport({
            scale:1.4
          });


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.className =
          "pdf-page";


        const context =
          canvas.getContext(
            "2d"
          );


        canvas.width =
          viewport.width;


        canvas.height =
          viewport.height;


        container.appendChild(
          canvas
        );


        await page.render({
          canvasContext:context,
          viewport:viewport
        }).promise;

      }

    }
    catch(error){

      console.error(error);


      reader.innerHTML = `

        <div class="message">

          <h2>
            ❌ PDF Open नहीं हो पाई
          </h2>

          <p class="error">
            PDF link या Google Drive permission check करें।
          </p>

          <p class="notice">
            Google Drive file को "Anyone with the link"
            के लिए Viewer access देना जरूरी हो सकता है।
          </p>

        </div>

      `;

    }

  }


})();


/* =========================
   DISABLE RIGHT CLICK
========================= */

document.addEventListener(
  "contextmenu",
  function(event){

    event.preventDefault();

  }
);


/* =========================
   DISABLE TEXT SELECTION
========================= */

document.addEventListener(
  "selectstart",
  function(event){

    event.preventDefault();

  }
);


/* =========================
   DISABLE SOME SHORTCUTS
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      (event.ctrlKey || event.metaKey)
      &&
      (
        event.key.toLowerCase() === "s" ||
        event.key.toLowerCase() === "p" ||
        event.key.toLowerCase() === "u"
      )
    ){

      event.preventDefault();

    }

  }
);


/* =========================
   BLOCK LONG PRESS MENU
========================= */

document.addEventListener(
  "touchstart",
  function(event){

    if(event.touches.length > 1){

      event.preventDefault();

    }

  },
  {passive:false}
);

</script>


</body>

</html>
