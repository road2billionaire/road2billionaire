<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Read eBook | Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:58px;
  background:#000;
  border-bottom:1px solid #ffd700;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 15px;

  position:sticky;
  top:0;
  z-index:999;
}

.logo{
  color:#ffd700;
  font-size:20px;
  font-weight:bold;
}

.back{
  color:#ffd700;
  text-decoration:none;

  background:#222;

  padding:9px 14px;

  border-radius:7px;

  font-size:14px;
}

.back:hover{
  background:#333;
}

/* =========================
   BOOK TITLE
========================= */

#bookTitle{
  min-height:45px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:10px 15px;

  background:#181818;

  border-bottom:1px solid #333;

  color:#fff;

  font-size:17px;

  font-weight:bold;
}

/* =========================
   LOADING
========================= */

#loading{
  text-align:center;

  padding:35px 20px;

  color:#ffd700;

  font-size:17px;
}

/* =========================
   ERROR
========================= */

#error{
  display:none;

  max-width:600px;

  margin:30px auto;

  padding:25px 20px;

  text-align:center;

  color:#ff6b6b;

  background:#181818;

  border:1px solid #333;

  border-radius:12px;

  line-height:1.7;
}

/* =========================
   PDF VIEWER
========================= */

#reader{
  display:none;

  width:100%;

  padding:8px;

  background:#111;
}

.pdf-frame{
  display:block;

  width:100%;

  height:calc(100vh - 120px);

  min-height:600px;

  border:0;

  border-radius:5px;

  background:#fff;
}

/* =========================
   BOTTOM NOTE
========================= */

.note{
  text-align:center;

  color:#777;

  font-size:11px;

  padding:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{
    height:55px;
    padding:0 10px;
  }

  .logo{
    font-size:17px;
  }

  .back{
    padding:8px 11px;
    font-size:13px;
  }

  #bookTitle{
    font-size:15px;
  }

  #reader{
    padding:3px;
  }

  .pdf-frame{
    height:calc(100vh - 105px);
    min-height:500px;
    border-radius:3px;
  }

}

</style>

</head>

<body>

     TOP BAR
========================= -->
