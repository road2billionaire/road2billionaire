<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Read eBook - Road2Billionaire</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

.topbar{
  background:#000;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#ffd700;
  position:sticky;
  top:0;
  z-index:999;
}

#bookTitle{
  text-align:center;
  padding:12px;
  font-size:18px;
  background:#181818;
  color:#fff;
}

#loading{
  text-align:center;
  padding:30px;
  font-size:18px;
}

#error{
  display:none;
  text-align:center;
  padding:30px 20px;
  color:#ff6b6b;
  font-size:17px;
}

#viewer{
  padding:10px 10px 40px;
}

.page{
  display:block;
  width:100%;
  max-width:900px;
  height:auto;
  margin:15px auto;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.5);
}

.back{
  display:block;
  width:max-content;
  margin:15px auto 30px;
  padding:10px 18px;
  background:#ffd700;
  color:#000;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

<div class="topbar">
  📚 Road2Billionaire
</div>

<div id="bookTitle">
  Loading eBook...
</div>

<div id="loading">
  📖 PDF load ho rahi hai...
</div>

<div id="error">
  ❌ PDF open nahi ho paayi.
</div>

<div id="viewer"></div>

<a href="Dashboard.html" class="back">
  ← Back to Dashboard
</a>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* GET BOOK ID */

const params =
new URLSearchParams(window.location.search);

const bookId =
params.get("id");


const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const viewer =
document.getElementById("viewer");

const title =
document.getElementById("bookTitle");


/* LOAD BOOK DATA */

let books = [];

try{

  books =
  JSON.parse(
    localStorage.getItem("ebooksData") || "[]"
  );

}
catch(e){

  books = [];

}


/* LOAD PURCHASE DATA */

let purchases = [];

try{

  purchases =
  JSON.parse(
    localStorage.getItem("purchasedBooks") || "[]"
  );

}
catch(e){

  purchases = [];

}


/* FIND BOOK */

const book =
books.find(function(item){

  return String(item.id) ===
         String(bookId);

});


/* SHOW ERROR */

function showError(message){

  loading.style.display = "none";

  errorBox.style.display = "block";

  errorBox.innerHTML = message;

}


/* BOOK NOT FOUND */

if(!book){

  showError(
    "❌ eBook nahi mili.<br><br>" +
    "Book ID: " + bookId
  );

}


/* CHECK PURCHASE */

else{

  title.innerText =
    book.title || "eBook";


  /*
    PURCHASE CHECK

    Format 1:
    { bookId: 123 }

    Format 2:
    { bookId: "123" }

    Format 3:
    "123"
  */

  const isPurchased =
  purchases.some(function(item){

    if(
      typeof item === "object" &&
      item !== null
    ){

      return String(item.bookId) ===
             String(book.id);

    }

    return String(item) ===
           String(book.id);

  });


  if(!isPurchased){

    showError(
      "🔒 Ye eBook purchased nahi hai.<br><br>" +
      "Pehle eBook purchase karein."
    );

  }

  else{

    const pdfUrl =
      book.pdfUrl;


    if(!pdfUrl){

      showError(
        "❌ Is eBook ka PDF URL nahi mila.<br><br>" +
        "Admin panel se PDF link check karein."
      );

    }

    else{

      console.log(
        "BOOK:",
        book
      );

      console.log(
        "PDF URL:",
        pdfUrl
      );

      loadPDF(pdfUrl);

    }

  }

}


/* LOAD PDF */

async function loadPDF(url){

  try{

    loading.innerText =
      "📖 PDF load ho rahi hai...";


    const loadingTask =
      pdfjsLib.getDocument({

        url:url,

        withCredentials:false

      });


    const pdf =
      await loadingTask.promise;


    loading.style.display =
      "none";


    viewer.innerHTML = "";


    console.log(
      "Total Pages:",
      pdf.numPages
    );


    for(
      let pageNumber = 1;
      pageNumber <= pdf.numPages;
      pageNumber++
    ){

      const page =
        await pdf.getPage(pageNumber);


      const viewport =
        page.getViewport({
          scale:1.5
        });


      const canvas =
        document.createElement("canvas");


      canvas.className =
        "page";


      const context =
        canvas.getContext("2d");


      canvas.width =
        viewport.width;


      canvas.height =
        viewport.height;


      viewer.appendChild(canvas);


      await page.render({

        canvasContext:context,

        viewport:viewport

      }).promise;

    }

  }

  catch(error){

    console.error(
      "PDF ERROR:",
      error
    );


    showError(
      "❌ PDF open nahi ho paayi.<br><br>" +
      "PDF link ya Cloudinary CORS setting check karni hogi."
    );

  }

}


/* DISABLE RIGHT CLICK */

document.addEventListener(
"contextmenu",
function(e){

  e.preventDefault();

});


/* DISABLE SELECTION */

document.addEventListener(
"selectstart",
function(e){

  e.preventDefault();

});


/* BLOCK BASIC SHORTCUTS */

document.addEventListener(
"keydown",
function(e){

  if(
    (e.ctrlKey || e.metaKey) &&
    ["s","p","u","c"].includes(
      e.key.toLowerCase()
    )
  ){

    e.preventDefault();

  }

});

</script>

</body>

</html>
